<!DOCTYPE html>
<html lang="mr">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Parent Verification</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background: linear-gradient(
        135deg,
        #111827,
        #1e3a8a
      );

      color: white;
    }

    .container {
      width: 90%;
      max-width: 420px;

      padding: 30px;

      text-align: center;

      background: rgba(255,255,255,0.09);

      border-radius: 22px;

      backdrop-filter: blur(12px);

      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
    }

    .icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 5px 0 10px;
    }

    p {
      color: #d1d5db;
      line-height: 1.5;
    }

    input {
      width: 100%;

      padding: 16px;

      margin-top: 20px;

      border: none;
      outline: none;

      border-radius: 12px;

      font-size: 17px;
    }

    button {
      width: 100%;

      padding: 16px;

      margin-top: 15px;

      border: none;

      border-radius: 12px;

      background: #2563eb;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .back {
      background: #374151;
    }

    #message {
      margin-top: 20px;

      padding: 15px;

      border-radius: 12px;

      display: none;

      background: rgba(255,255,255,0.1);
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="icon">👨‍👩‍👧</div>

    <h1>Parent</h1>

    <p>
      Enter the child's mobile number
      to send a verification request.
    </p>


    <input
      type="tel"
      id="mobileNumber"
      placeholder="10 digit mobile number"
      maxlength="10"
    >


    <button onclick="sendRequest()">
      Send Verification Request
    </button>


    <div id="message"></div>


    <button
      class="back"
      onclick="goBack()">

      ← Back

    </button>

  </div>


  <script>

    function sendRequest() {

      const number =
        document.getElementById("mobileNumber").value.trim();

      const message =
        document.getElementById("message");


      if (!/^[0-9]{10}$/.test(number)) {

        message.style.display = "block";

        message.innerHTML =
          "❌ कृपया 10 digit mobile number टाका.";

        return;
      }


      message.style.display = "block";

      message.innerHTML =
        "📩 Verification request तयार आहे.<br><br>" +
        "Child ने स्वतःच्या फोनवर request approve केल्यानंतरच पुढचा access सुरू होईल.";

    }


    function goBack() {

      window.location.href = "index.html";

    }

  </script>

</body>

</html>
