<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Screen Sharing</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
}

.container{
  width:90%;
  max-width:450px;
  padding:30px;
  text-align:center;
  background:#1f2937;
  border-radius:20px;
}

.icon{font-size:60px}

p{
  color:#d1d5db;
  line-height:1.5;
}

button{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.stop{
  background:#dc2626;
}

#status{
  margin-top:20px;
  color:#d1d5db;
}
</style>
</head>

<body>

<div class="container">

  <div class="icon">📱</div>

  <h1>Screen Sharing</h1>

  <p>
    Screen share करण्यासाठी तुमची स्पष्ट permission आवश्यक आहे.
    Share केल्यावर browser मध्ये screen-sharing indicator दिसेल.
  </p>

  <button id="shareButton" onclick="startSharing()">
    Share Screen
  </button>

  <div id="status"></div>

</div>

<script>

let screenStream = null;

async function startSharing(){

  const status =
    document.getElementById("status");

  const button =
    document.getElementById("shareButton");

  if(!navigator.mediaDevices ||
     !navigator.mediaDevices.getDisplayMedia){

    status.innerHTML =
      "❌ या browser मध्ये screen sharing उपलब्ध नाही.";

    return;
  }

  try{

    screenStream =
      await navigator.mediaDevices.getDisplayMedia({
        video:true,
        audio:false
      });

    status.innerHTML =
      "✓ Screen sharing सुरू आहे.";

    button.innerHTML =
      "Stop Sharing";

    button.classList.add("stop");

    button.onclick = stopSharing;

    screenStream
      .getVideoTracks()[0]
      .addEventListener("ended", stopSharing);

  }catch(error){

    status.innerHTML =
      "❌ Screen sharing cancel केले किंवा permission मिळाली नाही.";

  }
}

function stopSharing(){

  if(screenStream){

    screenStream
      .getTracks()
      .forEach(track => track.stop());

    screenStream = null;
  }

  document.getElementById("status").innerHTML =
    "Screen sharing बंद केले.";

  const button =
    document.getElementById("shareButton");

  button.innerHTML =
    "Share Screen";

  button.classList.remove("stop");

  button.onclick = startSharing;
}

</script>

</body>
</html>
