<!DOCTYPE html>
<html lang="mr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Messages</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  font-family:Arial,sans-serif;

  background:#111827;
  color:white;
}

.container{
  width:90%;
  max-width:450px;

  padding:30px;

  background:#1f2937;

  border-radius:20px;

  text-align:center;
}

.icon{
  font-size:60px;
}

p{
  color:#d1d5db;
  line-height:1.6;
}

.notice{
  margin-top:20px;
  padding:18px;

  background:#374151;

  border-radius:15px;

  text-align:left;
}

button{
  width:100%;
  padding:15px;

  margin-top:20px;

  border:0;
  border-radius:10px;

  background:#2563eb;
  color:white;

  font-size:16px;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

  <div class="icon">💬</div>

  <h1>Messages</h1>

  <p>
    Parent आणि Child एकमेकांना
    consent-based message पाठवू शकतात.
  </p>

  <div class="notice">

    🔒 <b>Privacy Notice</b>

    <br><br>

    Private SMS, WhatsApp किंवा इतर
    personal messages लपून read केले जाणार नाहीत.

  </div>

  <button onclick="sendMessage()">
    Send Message Request
  </button>

</div>

<script>

function sendMessage(){

  alert(
    "Message request तयार आहे. Child ची permission आवश्यक आहे."
  );

}

</script>

</body>

</html>
