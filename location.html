<!DOCTYPE html>
<html lang="mr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Location Permission</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background: #111827;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 450px;

      padding: 30px;

      text-align: center;

      background: #1f2937;

      border-radius: 20px;
    }

    .icon {
      font-size: 60px;
    }

    h1 {
      margin: 15px 0;
    }

    p {
      color: #d1d5db;
      line-height: 1.5;
    }

    button {
      width: 100%;

      padding: 15px;

      margin-top: 20px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    .location-box {
      display: none;

      margin-top: 20px;

      padding: 18px;

      border-radius: 15px;

      background: #374151;

      text-align: left;

      line-height: 1.8;
    }

    #status {
      margin-top: 18px;
      color: #d1d5db;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="icon">📍</div>

    <h1>Location Access</h1>

    <p>
      Parent ने location access request केला आहे.
      Location share करण्यासाठी तुमची permission आवश्यक आहे.
    </p>


    <button onclick="getLocation()">
      Allow Location
    </button>


    <div id="status"></div>


    <div
      id="locationBox"
      class="location-box">

      <b>Location:</b><br>

      Latitude:
      <span id="latitude">--</span>

      <br>

      Longitude:
      <span id="longitude">--</span>

      <br>

      Accuracy:
      <span id="accuracy">--</span>

      meters

    </div>

  </div>


  <script>

    function getLocation() {

      const status =
        document.getElementById("status");

      if (!navigator.geolocation) {

        status.innerHTML =
          "❌ या browser मध्ये location उपलब्ध नाही.";

        return;
      }


      status.innerHTML =
        "📍 Location permission मागितली जात आहे...";


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;

          const accuracy =
            position.coords.accuracy;


          document.getElementById(
            "latitude"
          ).textContent =
            latitude.toFixed(6);


          document.getElementById(
            "longitude"
          ).textContent =
            longitude.toFixed(6);


          document.getElementById(
            "accuracy"
          ).textContent =
            Math.round(accuracy);


          document.getElementById(
            "locationBox"
          ).style.display = "block";


          status.innerHTML =
            "✓ Location permission granted.";

        },


        function(error) {

          status.innerHTML =
            "❌ Location permission denied किंवा उपलब्ध नाही.";

        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }

      );

    }

  </script>

</body>

</html>
