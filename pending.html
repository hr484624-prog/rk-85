<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Pending Requests</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f5f7;
    min-height:100vh;
    color:#111;
}

.topbar{
    height:65px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    box-shadow:0 1px 8px rgba(0,0,0,.08);
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.logout{
    border:0;
    background:#111;
    color:white;
    padding:9px 13px;
    border-radius:9px;
}

.container{
    width:92%;
    max-width:450px;
    margin:30px auto;
}

.card{
    background:white;
    padding:22px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
    margin-bottom:18px;
}

.title{
    font-size:23px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    font-size:14px;
    line-height:1.5;
}

.request{
    border:1px solid #e1e1e1;
    border-radius:14px;
    padding:16px;
    margin-top:14px;
}

.username{
    font-size:17px;
    font-weight:bold;
}

.info{
    color:#777;
    font-size:13px;
    margin-top:6px;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.btn{
    flex:1;
    padding:12px;
    border:0;
    border-radius:10px;
    font-size:14px;
}

.confirm{
    background:#16883b;
    color:white;
}

.reject{
    background:#eee;
    color:#111;
}

.message{
    text-align:center;
    color:#777;
    padding:25px 5px;
}

.error{
    color:#b42318;
}

</style>

</head>

<body>

<div class="topbar">

    <div class="logo">
        Account Connect
    </div>

    <button
        class="logout"
        onclick="logout()"
    >
        Logout
    </button>

</div>


<div class="container">

<div class="card">

    <div class="title">
        Pending Requests
    </div>

    <div class="subtitle">
        Requests sent to your account will appear
        here.
    </div>

</div>


<div
    class="card"
    id="requestContainer"
>

    <div class="message">
        Loading requests...
    </div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    getDatabase,
    ref,
    onValue,
    update
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDul4AsRqtVgXlaN-7ery3ElF-ycONE0Tw",

    authDomain:
        "family-connect-65de6.firebaseapp.com",

    databaseURL:
        "https://family-connect-65de6-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "family-connect-65de6",

    storageBucket:
        "family-connect-65de6.firebasestorage.app",

    messagingSenderId:
        "819152591874",

    appId:
        "1:819152591874:web:3214a0348da687f9351b1b",

    measurementId:
        "G-2WN5DF6TPL"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


let currentUser = null;


onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            location.href =
                "login.html";

            return;

        }


        currentUser = user;

        loadRequests();

    }
);


function loadRequests(){

    const container =
        document.getElementById(
            "requestContainer"
        );


    const requestsRef =
        ref(
            db,
            "accountRequests"
        );


    onValue(
        requestsRef,
        function(snapshot){

            const data =
                snapshot.val() || {};


            container.innerHTML = "";


            let found = false;


            Object.entries(data)
            .forEach(
                function([id,request]){


                    if(
                        request.targetUid ===
                        currentUser.uid
                        &&
                        request.status ===
                        "pending"
                    ){

                        found = true;

                        createRequestBox(
                            id,
                            request,
                            container
                        );

                    }

                }
            );


            if(!found){

                container.innerHTML = `
                    <div class="message">
                        No pending requests.
                    </div>
                `;

            }

        },
        function(error){

            console.error(error);

            container.innerHTML = `
                <div class="message error">
                    Could not load requests.
                </div>
            `;

        }
    );

}


function createRequestBox(
    id,
    request,
    container
){

    const box =
        document.createElement("div");

    box.className =
        "request";


    const username =
        document.createElement("div");

    username.className =
        "username";

    username.textContent =
        "@" + request.username;


    const info =
        document.createElement("div");

    info.className =
        "info";

    info.textContent =
        "Someone wants to connect this account.";


    const buttons =
        document.createElement("div");

    buttons.className =
        "buttons";


    const confirm =
        document.createElement("button");

    confirm.className =
        "btn confirm";

    confirm.textContent =
        "✓ Confirm";


    const reject =
        document.createElement("button");

    reject.className =
        "btn reject";

    reject.textContent =
        "Reject";


    confirm.onclick =
        function(){

            changeStatus(
                id,
                "confirmed"
            );

        };


    reject.onclick =
        function(){

            changeStatus(
                id,
                "rejected"
            );

        };


    buttons.appendChild(confirm);
    buttons.appendChild(reject);

    box.appendChild(username);
    box.appendChild(info);
    box.appendChild(buttons);

    container.appendChild(box);

}


async function changeStatus(
    id,
    status
){

    try{

        await update(

            ref(
                db,
                "accountRequests/" + id
            ),

            {

                status:
                    status,

                confirmedAt:
                    status === "confirmed"
                    ? new Date().toISOString()
                    : null

            }

        );


    }
    catch(error){

        console.error(error);

        alert(
            "Request update झाली नाही."
        );

    }

}


window.logout =
async function(){

    await signOut(auth);

    location.href =
        "login.html";

};

</script>

</body>
</html>
