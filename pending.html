<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pending Requests - Account Connect</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f5f7;
    min-height:100vh;
    color:#111;
}

.topbar{
    height:65px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    box-shadow:0 1px 8px rgba(0,0,0,.08);
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.logout{
    border:0;
    background:#111;
    color:white;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
}

.container{
    width:92%;
    max-width:450px;
    margin:30px auto;
}

.card{
    background:white;
    padding:22px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
    margin-bottom:18px;
}

.title{
    font-size:23px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    font-size:14px;
    line-height:1.5;
    margin-bottom:20px;
}

.user-box{
    background:#f4f5f7;
    padding:14px;
    border-radius:12px;
    margin-top:10px;
}

.user-label{
    color:#777;
    font-size:12px;
    margin-bottom:5px;
}

.user-email{
    font-weight:bold;
    word-break:break-all;
}

.request{
    border:1px solid #e1e1e1;
    border-radius:14px;
    padding:16px;
    margin-top:12px;
}

.username{
    font-weight:bold;
    font-size:17px;
}

.date{
    color:#777;
    font-size:12px;
    margin-top:5px;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:14px;
}

.btn{
    flex:1;
    padding:12px;
    border:0;
    border-radius:10px;
    font-size:14px;
    cursor:pointer;
}

.confirm{
    background:#16883b;
    color:white;
}

.reject{
    background:#eee;
    color:#111;
}

.message{
    text-align:center;
    color:#777;
    padding:20px 5px;
}

.loading{
    text-align:center;
    color:#777;
    padding:20px 5px;
}

.success{
    color:#16883b;
    background:#e9f8ee;
    padding:12px;
    border-radius:10px;
    margin-top:12px;
    display:none;
}

.error{
    color:#b42318;
    background:#fff0f0;
    padding:12px;
    border-radius:10px;
    margin-top:12px;
    display:none;
}

.uid-box{
    margin-top:12px;
    font-size:11px;
    color:#999;
    word-break:break-all;
}

</style>

</head>

<body>


<!-- TOP BAR -->

<div class="topbar">

    <div class="logo">
        Account Connect
    </div>

    <button
        class="logout"
        onclick="logoutUser()"
    >
        Logout
    </button>

</div>


<!-- MAIN -->

<div class="container">


    <!-- USER CARD -->

    <div class="card">

        <div class="title">
            Pending Requests
        </div>

        <div class="subtitle">
            Connection requests sent to your account
            will appear here.
        </div>


        <div class="user-box">

            <div class="user-label">
                Logged in as
            </div>

            <div
                id="userEmail"
                class="user-email"
            >
                Checking login...
            </div>

            <div
                id="userUid"
                class="uid-box"
            ></div>

        </div>


        <div
            id="error"
            class="error"
        ></div>


        <div
            id="success"
            class="success"
        ></div>

    </div>


    <!-- REQUESTS -->

    <div
        class="card"
        id="requestContainer"
    >

        <div class="loading">
            Loading requests...
        </div>

    </div>

</div>


<script type="module">


/* =====================================
   FIREBASE IMPORT
===================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
    getDatabase,
    ref,
    onValue,
    update
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDul4AsRqtVgXlaN-7ery3ElF-ycONE0Tw",

    authDomain:
        "family-connect-65de6.firebaseapp.com",

    databaseURL:
        "https://family-connect-65de6-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "family-connect-65de6",

    storageBucket:
        "family-connect-65de6.firebasestorage.app",

    messagingSenderId:
        "819152591874",

    appId:
        "1:819152591874:web:3214a0348da687f9351b1b",

    measurementId:
        "G-2WN5DF6TPL"

};


/* =====================================
   START FIREBASE
===================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


/* =====================================
   VARIABLES
===================================== */

let currentUser = null;

let requestsListener = null;


/* =====================================
   ELEMENTS
===================================== */

const requestContainer =
    document.getElementById(
        "requestContainer"
    );

const userEmail =
    document.getElementById(
        "userEmail"
    );

const userUid =
    document.getElementById(
        "userUid"
    );

const errorBox =
    document.getElementById(
        "error"
    );

const successBox =
    document.getElementById(
        "success"
    );


/* =====================================
   AUTH CHECK
===================================== */

onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            userEmail.textContent =
                "Not logged in";

            requestContainer.innerHTML = `
                <div class="message">

                    Please login first.

                </div>
            `;

            return;
        }


        currentUser =
            user;


        /* Show logged-in email */

        userEmail.textContent =
            user.email || "Account";


        /* Show UID for testing */

        userUid.textContent =
            "UID: " + user.uid;


        /* Load only this user's requests */

        loadRequestsForUser(
            user.uid
        );

    }
);


/* =====================================
   LOAD USER REQUESTS
===================================== */

function loadRequestsForUser(
    uid
){

    requestContainer.innerHTML = `
        <div class="loading">
            Loading requests...
        </div>
    `;


    const requestsRef =
        ref(
            db,
            "accountRequests"
        );


    /*
       Listen for Firebase changes.
       Only requests whose targetUid
       matches logged-in user's UID
       will be displayed.
    */

    requestsListener =
        onValue(

            requestsRef,

            function(snapshot){

                const data =
                    snapshot.val() || {};


                requestContainer.innerHTML = "";


                let found =
                    false;


                Object.entries(data)
                    .forEach(
                        function([
                            id,
                            request
                        ]){


                            if(
                                !request
                            ){

                                return;

                            }


                            /*
                               IMPORTANT:

                               targetUid must be saved
                               by Account Request page.
                            */

                            const targetUid =
                                request.targetUid;


                            const status =
                                request.status;


                            if(
                                targetUid === uid
                                &&
                                status === "pending"
                            ){

                                found =
                                    true;


                                showRequest(
                                    id,
                                    request
                                );

                            }

                        }
                    );


                if(!found){

                    requestContainer.innerHTML = `
                        <div class="message">

                            No pending requests.

                        </div>
                    `;

                }

            },

            function(firebaseError){

                console.error(
                    "Firebase error:",
                    firebaseError
                );


                requestContainer.innerHTML = `
                    <div class="message">

                        Could not load requests.

                        <br><br>

                        Check Firebase Database Rules.

                    </div>
                `;

            }

        );

}


/* =====================================
   SHOW REQUEST
===================================== */

function showRequest(
    id,
    request
){

    const box =
        document.createElement(
            "div"
        );


    box.className =
        "request";


    /* USERNAME */

    const username =
        document.createElement(
            "div"
        );


    username.className =
        "username";


    username.textContent =
        "@" +
        (
            request.username ||
            "Unknown user"
        );


    /* DATE */

    const date =
        document.createElement(
            "div"
        );


    date.className =
        "date";


    if(request.createdAt){

        const dateObject =
            new Date(
                request.createdAt
            );


        date.textContent =
            "Request received: " +
            dateObject.toLocaleString();

    }
    else{

        date.textContent =
            "Connection request received";

    }


    /* BUTTON AREA */

    const buttons =
        document.createElement(
            "div"
        );


    buttons.className =
        "buttons";


    /* CONFIRM */

    const confirmBtn =
        document.createElement(
            "button"
        );


    confirmBtn.className =
        "btn confirm";


    confirmBtn.textContent =
        "✓ Confirm";


    confirmBtn.onclick =
        function(){

            changeRequestStatus(
                id,
                "confirmed"
            );

        };


    /* REJECT */

    const rejectBtn =
        document.createElement(
            "button"
        );


    rejectBtn.className =
        "btn reject";


    rejectBtn.textContent =
        "Reject";


    rejectBtn.onclick =
        function(){

            changeRequestStatus(
                id,
                "rejected"
            );

        };


    buttons.appendChild(
        confirmBtn
    );


    buttons.appendChild(
        rejectBtn
    );


    box.appendChild(
        username
    );


    box.appendChild(
        date
    );


    box.appendChild(
        buttons
    );


    requestContainer.appendChild(
        box
    );

}


/* =====================================
   CONFIRM / REJECT
===================================== */

async function changeRequestStatus(
    id,
    status
){

    if(!currentUser){

        showError(
            "You must be logged in."
        );

        return;

    }


    try{

        await update(

            ref(
                db,
                "accountRequests/" +
                id
            ),

            {

                status:
                    status,

                confirmedAt:
                    status === "confirmed"
                        ? new Date().toISOString()
                        : null

            }

        );


        if(
            status === "confirmed"
        ){

            showSuccess(
                "Connection request confirmed."
            );

        }
        else{

            showSuccess(
                "Connection request rejected."
            );

        }

    }
    catch(error){

        console.error(
            "Update error:",
            error
        );


        showError(
            "Could not update request. Check Firebase Rules."
        );

    }

}


/* =====================================
   SUCCESS MESSAGE
===================================== */

function showSuccess(
    message
){

    successBox.textContent =
        message;


    successBox.style.display =
        "block";


    errorBox.style.display =
        "none";


    setTimeout(
        function(){

            successBox.style.display =
                "none";

        },
        3000
    );

}


/* =====================================
   ERROR MESSAGE
===================================== */

function showError(
    message
){

    errorBox.textContent =
        message;


    errorBox.style.display =
        "block";


    successBox.style.display =
        "none";

}


/* =====================================
   LOGOUT
===================================== */

window.logoutUser =
async function(){

    try{

        await signOut(
            auth
        );


        window.location.href =
            "login.html";

    }
    catch(error){

        console.error(
            "Logout error:",
            error
        );

    }

};


</script>

</body>
</html>
