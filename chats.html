<style>

.grad{background:linear-gradient(135deg,var(--a),var(--b))}
.page{position:fixed;inset:0;display:flex;flex-direction:column;background:
 radial-gradient(500px 300px at 0 0,color-mix(in srgb,var(--a) 20%,transparent),transparent 60%),
 radial-gradient(500px 400px at 100% 100%,color-mix(in srgb,var(--b) 14%,transparent),transparent 60%),var(--bg)}
.hdr{height:58px;padding:0 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;position:relative;background:rgba(0,0,0,.25);backdrop-filter:blur(10px)}

.bdg{min-width:21px;height:21px;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
.empty{text-align:center;color:var(--muted);padding:60px 24px;line-height:1.7}
.empty b{display:block;font-size:44px;margin-bottom:8px}
.btn{padding:10px 14px;border-radius:12px;font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}

.av{border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0;position:relative}
.dot{position:absolute;right:0;bottom:0;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2.5px solid var(--card)}

/* chat overlay */
.ov{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column}
.ov.show{display:flex}

.bub{max-width:80%;padding:8px 12px 5px;border-radius:17px;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-bottom-right-radius:5px}

.bub.media{padding:4px 4px 5px}.bub.media .t{padding:0 6px}
.mimg{display:block;width:230px;max-width:100%;max-height:300px;border-radius:13px;object-fit:cover;background:#000}
.tk{letter-spacing:-2px}.tk.rd{color:#7df;opacity:1}
.warn{margin-top:6px;padding:6px 8px;border-radius:10px;background:rgba(255,84,112,.18);border:1px solid var(--bad);font-size:12px;color:#ffc3cd}

#micB.recing{background:var(--bad);color:#fff;font-size:12px;width:auto;min-width:38px;padding:0 10px;border-radius:19px}
/* sheet */
.sheetbg{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center}

.sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:20px 18px 26px}

#callUI{background:#000;z-index:500}
#remoteV{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#localV{position:absolute;right:14px;top:80px;width:104px;height:146px;object-fit:cover;border-radius:16px;border:2px solid rgba(255,255,255,.4);background:#111;transform:scaleX(-1);z-index:2}
.callTop{position:relative;z-index:2;padding:26px 20px;text-align:center;text-shadow:0 2px 10px #000}
.callMid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;pointer-events:none}
.callBar{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;justify-content:center;gap:16px;padding:22px 10px calc(28px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(0,0,0,.8),transparent)}
.cb{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.22);font-size:24px}
.cb.off{background:#fff;color:#000}.cb.end{background:var(--bad)}.cb.acc{background:var(--ok)}
.ring{width:130px;height:130px;font-size:52px;animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,61,127,.55)}100%{box-shadow:0 0 0 40px rgba(255,61,127,0)}}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:900;background:var(--card2);border:1px solid var(--a);padding:11px 18px;border-radius:14px;font-size:14px;max-width:90%;text-align:center;display:none}
.toast.show{display:block}
.loader{width:34px;height:34px;margin:30px auto;border-radius:50%;border:3px solid var(--line);border-top-color:var(--a);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

<!-- ============ CHATS LIST PAGE ============ -->

<script>
/* ============ CONFIG (index.html सारखेच) ============ */
const SB_URL="https://eqglttfffhvoyvrclzse.supabase.co";
const SB_KEY="sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";
const AI_URL="https://gyan-setu-self.vercel.app/api/chat";
const BUCKET="lgmedia";
const sb=supabase.createClient(SB_URL,SB_KEY);
const ICE=[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}];

/* ============ STATE ============ */
let me=null,prof=null,chatTabSel="m",chatPeer=null,rendered=new Set(),lastDay="";
let myLikes=new Set(),likedMe=new Set(),blocked=new Set(),pcache={},lastMsg={},unread={},onlineSet=new Set();
const settings=JSON.parse(localStorage.getItem("lg_settings")||'{"theme":"rose","sound":true}');
document.documentElement.dataset.theme=settings.theme||"rose";

/* ============ HELPERS ============ */
const $=id=>document.getElementById(id);
const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ageOf=d=>{if(!d)return"";const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();const m=n.getMonth()-b.getMonth();if(m<0||(m===0&&n.getDate()<b.getDate()))a--;return a};
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),3000)}
const clock=i=>new Date(i).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:true});
function ago(i){if(!i)return"";const d=new Date(i),n=new Date();if(d.toDateString()===n.toDateString())return clock(i);const y=new Date();y.setDate(n.getDate()-1);if(d.toDateString()===y.toDateString())return"काल";return d.toLocaleDateString("en-IN",{day:"2-digit",month:"2-digit"})}
function dayLbl(i){const d=new Date(i),n=new Date(),y=new Date();y.setDate(n.getDate()-1);return d.toDateString()===n.toDateString()?"आज":d.toDateString()===y.toDateString()?"काल":d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}
const MP=/^::(img|vid|aud)::/;
const prevTxt=c=>{c=String(c||"");const m=c.match(MP);return m?({img:"📷 Photo",vid:"🎥 Video",aud:"🎤 Voice message"})[m[1]]:c};
const PAL=[["#ff3d7f","#ff9a3d"],["#9b5cff","#ff4fd8"],["#00c2ff","#00e0a4"],["#ff6b6b","#feca57"],["#5f27cd","#ff6b81"]];
function avHTML(p,s){
  s=s||50;const dot=p&&p.show_online!==false&&onlineSet.has(p.id)?'<span class="dot"></span>':"";
  if(p&&p.photo)return`<div class="av" style="width:${s}px;height:${s}px;background-image:url(${p.photo})">${dot}</div>`;
  let h=0;const k=String(p?.id||"x");for(let i=0;i<k.length;i++)h=(h*31+k.charCodeAt(i))>>>0;const c=PAL[h%PAL.length];
  return`<div class="av" style="width:${s}px;height:${s}px;font-size:${s*.42}px;background:linear-gradient(135deg,${c[0]},${c[1]})">${e((p?.name||"?")[0].toUpperCase())}${dot}</div>`;
}
const vbadge=p=>p?.verified?'<span class="vb">✓</span>':"";
function openSheet(h){$("sheet").innerHTML=h;$("sheetBg").classList.add("show")}
function closeSheet(){$("sheetBg").classList.remove("show")}

/* ============ SAFETY GUARD ============ */
const SEVERE=[/\botp\b/i,/\bcvv\b/i,/password|पासवर्ड/i,/\bupi\b|gpay|phonepe|paytm|google ?pay/i,/gift ?card/i,/bitcoin|crypto|invest(ment)?|गुंतवणूक/i,/western union/i,/(account|खाते)\s*(no|number|क्रमांक)/i,/\bifsc\b/i,/पैसे\s*(पाठव|दे|हवे)|paise\s*(pathav|de|have)|send (me )?money|रक्कम\s*पाठव|money transfer/i,/loan|कर्ज/i,/aadhaar|आधार\s*(क्रमांक|नंबर|number)|pan card/i];
const MEDIUM=[/https?:\/\/|www\.|bit\.ly|t\.me\//i,/(?:\+?91[\s-]?)?[6-9]\d{9}/,/whatsapp|telegram|insta(gram)?\s*(id|handle)|snap(chat)?/i,/nude|न्यूड|naked|sex\b|सेक्स/i,/private (video|show)|paid (video|call)/i];
function guard(t){
  t=String(t||"");if(MP.test(t))return{lvl:0};
  for(const r of SEVERE)if(r.test(t))return{lvl:2,why:"पैसे/OTP/बँक/ओळखपत्र संबंधित मजकूर"};
  for(const r of MEDIUM)if(r.test(t))return{lvl:1,why:"phone/link/बाहेर जाण्याचा प्रयत्न किंवा अश्लील मजकूर"};
  return{lvl:0};
}
async function callAI(question,ms){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms||25000);
  try{
    const r=await fetch(AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,body:JSON.stringify({question,image:null,imageType:null})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();return d.answer||d.message||d.response||d.text||"";
  }finally{clearTimeout(tm)}
}
async function aiClassify(text){
  try{
    const a=await callAI(`You are a fraud/safety detector for a dating app. Classify this chat message. Reply ONLY with JSON like {"risk":"safe|suspicious|scam","reason":"short Marathi reason"}.\nMessage: """${text.slice(0,500)}"""`,9000);
    const m=a.match(/\{[\s\S]*?\}/);return m?JSON.parse(m[0]):null;
  }catch(_){return null}
}

/* ============ BOOT ============ */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.replace("index.html");return}
  me=session.user;
  const {data}=await sb.from("lg_profiles").select("*").eq("id",me.id).maybeSingle();
  if(!data){location.replace("index.html");return}
  prof=data;pcache[me.id]=prof;
  await loadSocial();await loadMessages();renderChats();startRealtime();
  const c=new URLSearchParams(location.search).get("chat");
  if(c)openChat(c);
}
async function loadSocial(){
  const [a,b,c]=await Promise.all([
    sb.from("lg_likes").select("to_id").eq("from_id",me.id),
    sb.from("lg_likes").select("from_id").eq("to_id",me.id),
    sb.from("lg_blocks").select("blocked").eq("blocker",me.id)]);
  myLikes=new Set((a.data||[]).map(x=>x.to_id));
  likedMe=new Set((b.data||[]).map(x=>x.from_id));
  blocked=new Set((c.data||[]).map(x=>x.blocked));
  await fetchProfiles([...myLikes,...likedMe]);
}
async function fetchProfiles(ids){
  const need=[...new Set(ids)].filter(i=>!pcache[i]);if(!need.length)return;
  const {data}=await sb.from("lg_profiles").select("*").in("id",need);
  (data||[]).forEach(p=>pcache[p.id]=p);
}
const matches=()=>[...myLikes].filter(i=>likedMe.has(i)&&!blocked.has(i)&&pcache[i]);
async function loadMessages(){
  lastMsg={};unread={};
  const {data}=await sb.from("lg_messages").select("*").or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`).order("created_at",{ascending:false}).limit(500);
  (data||[]).forEach(m=>{
    const o=m.sender_id===me.id?m.receiver_id:m.sender_id;
    if(!lastMsg[o])lastMsg[o]=m;
    if(m.receiver_id===me.id&&!m.is_read&&m.kind!=="call")unread[o]=(unread[o]||0)+1;
  });
}

/* ============ CHATS LIST ============ */
function chatTab(t){chatTabSel=t;$("tMatch").classList.toggle("on",t==="m");$("tLikes").classList.toggle("on",t==="l");renderChats()}
function renderChats(){
  const likes=[...likedMe].filter(i=>!myLikes.has(i)&&!blocked.has(i)&&pcache[i]);
  $("likeCnt").textContent=likes.length?`(${likes.length})`:"";
  const tot=Object.values(unread).reduce((a,b)=>a+b,0),tb=$("totUn");
  tb.textContent=tot>99?"99+":tot;tb.style.display=tot?"flex":"none";
  const q=$("chSearch").value.trim().toLowerCase();
  let h="";

function shrink(file,max){max=max||1280;return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{
  const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;
  c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error("img")),"image/jpeg",.8)};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function sendMedia(kind,blob,ext,type){

    if(up.error)throw up.error;

/* ============ CALLS (WebRTC) ============ */
let call=null,callTimer=null,pend=[],userCh={};
const subCh=ch=>new Promise(res=>{if(ch.state==="joined")return res();ch.subscribe(s=>{if(s==="SUBSCRIBED")res()})});
function uChan(id){if(!userCh[id])userCh[id]=sb.channel("lg-user-"+id);return userCh[id]}
const media=kind=>navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:kind==="video"?{facingMode:"user",width:640,height:480}:false});
async function startCall(kind){
  if(call||!chatPeer)return;
  if(!navigator.mediaDevices)return toast("Browser मध्ये call support नाही (https आवश्यक)");
  const peer=chatPeer;
  try{call={id:Date.now()+"-"+Math.random().toString(36).slice(2,8),peer,kind,role:"caller",connected:false};call.local=await media(kind)}
  catch(_){call=null;return toast("Mic/Camera ची परवानगी द्या")}
  showCall("Calling...");await joinCallChan();
  const uc=uChan(peer.id);await subCh(uc);
  uc.send({type:"broadcast",event:"invite",payload:{callId:call.id,from:me.id,name:prof.name,kind}});
  call.to=setTimeout(()=>{if(call&&!call.connected)endCall("no-answer")},45000);
}
async function joinCallChan(){
  const ch=sb.channel("lg-call-"+call.id);call.ch=ch;
  ch.on("broadcast",{event:"ready"},async()=>{if(call.role==="caller")await makePC(true)})
    .on("broadcast",{event:"offer"},async({payload})=>{await makePC(false);await call.pc.setRemoteDescription(payload.sdp);await flushPend();const a=await call.pc.createAnswer();await call.pc.setLocalDescription(a);ch.send({type:"broadcast",event:"answer",payload:{sdp:call.pc.localDescription}})})
    .on("broadcast",{event:"answer"},async({payload})=>{await call.pc.setRemoteDescription(payload.sdp);await flushPend()})
    .on("broadcast",{event:"ice"},async({payload})=>{if(call?.pc?.remoteDescription)try{await call.pc.addIceCandidate(payload.c)}catch(_){}else pend.push(payload.c)})
    .on("broadcast",{event:"end"},()=>endCall("remote",true));
  await subCh(ch);
}
async function flushPend(){for(const c of pend){try{await call.pc.addIceCandidate(c)}catch(_){}}pend=[]}
async function makePC(offer){
  if(call.pc)return;
  const pc=new RTCPeerConnection({iceServers:ICE});call.pc=pc;
  call.local.getTracks().forEach(t=>pc.addTrack(t,call.local));
  pc.onicecandidate=ev=>{if(ev.candidate)call.ch.send({type:"broadcast",event:"ice",payload:{c:ev.candidate}})};
  pc.ontrack=ev=>{$("remoteV").srcObject=ev.streams[0];$("remoteV").play().catch(()=>{})};
  pc.onconnectionstatechange=()=>{
    if(pc.connectionState==="connected"&&!call.connected){call.connected=true;call.t0=Date.now();clearTimeout(call.to);
      $("callMid").style.display=call.kind==="audio"?"flex":"none";
      callTimer=setInterval(()=>{const s=Math.floor((Date.now()-call.t0)/1000);$("callStat").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1000)}
    if(["failed","closed"].includes(pc.connectionState))endCall("failed");
  };
  if(offer){const o=await pc.createOffer();await pc.setLocalDescription(o);call.ch.send({type:"broadcast",event:"offer",payload:{sdp:pc.localDescription}})}
}
function showCall(stat,incoming){
  const p=call.peer;
  $("callName").textContent=p.name;$("callStat").textContent=stat;
  $("callAv").style.backgroundImage=p.photo?`url(${p.photo})`:"";$("callAv").style.backgroundSize="cover";$("callAv").textContent=p.photo?"":p.name[0];
  $("callMid").style.display="flex";
  $("localV").style.display=call.kind==="video"&&call.local?"block":"none";
  if(call.local)$("localV").srcObject=call.local;
  $("callBar").innerHTML=incoming
   ?`<button class="cb end" onclick="rejectCall()">✕</button><button class="cb acc" onclick="acceptCall()">📞</button>`
   :`<button class="cb" id="bMute" onclick="togMute()">🎙️</button>${call.kind==="video"?'<button class="cb" id="bCam" onclick="togCam()">📷</button>':""}<button class="cb" onclick="reportUser(call.peer.id)">🚩</button><button class="cb end" onclick="endCall('me')">✕</button>`;
  $("callUI").classList.add("show");
}
function togMute(){const t=call.local.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;$("bMute").classList.toggle("off",!t.enabled);$("bMute").textContent=t.enabled?"🎙️":"🔇"}
function togCam(){const t=call.local.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;$("bCam").classList.toggle("off",!t.enabled)}
async function onInvite(p){
  if(call||!matches().includes(p.from)||blocked.has(p.from)){uChan(p.from).send({type:"broadcast",event:"reject",payload:{callId:p.callId}});return}
  await fetchProfiles([p.from]);
  call={id:p.callId,peer:pcache[p.from]||{id:p.from,name:p.name},kind:p.kind,role:"callee",connected:false};
  showCall((p.kind==="video"?"🎥 Video":"📞 Voice")+" call येत आहे...",true);
  navigator.vibrate&&navigator.vibrate([400,200,400,200,400]);
  call.to=setTimeout(()=>{if(call&&!call.connected)rejectCall()},40000);
}
async function acceptCall(){
  clearTimeout(call.to);
  try{call.local=await media(call.kind)}catch(_){toast("Mic/Camera ची परवानगी द्या");return rejectCall()}
  showCall("Connecting...");await joinCallChan();
  call.ch.send({type:"broadcast",event:"ready",payload:{}});
}
function rejectCall(){if(!call)return;uChan(call.peer.id).send({type:"broadcast",event:"reject",payload:{callId:call.id}});cleanupCall()}
async function endCall(why,remote){
  if(!call)return;const c=call;
  if(!remote&&c.ch)c.ch.send({type:"broadcast",event:"end",payload:{}});
  if(c.role==="caller"){
    const secs=c.t0?Math.floor((Date.now()-c.t0)/1000):0;
    const label=(c.kind==="video"?"🎥 Video call":"📞 Voice call")+(secs?" • "+Math.floor(secs/60)+"m "+secs%60+"s":(why==="no-answer"||why==="rejected"?" • अनुत्तरित":""));
    const {data}=await sb.from("lg_messages").insert({sender_id:me.id,receiver_id:c.peer.id,content:label,kind:"call"}).select().single();
    if(data){lastMsg[c.peer.id]=data;if(chatPeer?.id===c.peer.id)addBub(data)}
  }
  if(why==="no-answer")toast("उत्तर मिळाले नाही");
  cleanupCall();
}
function cleanupCall(){
  if(!call)return;
  clearTimeout(call.to);clearInterval(callTimer);
  call.local?.getTracks().forEach(t=>t.stop());
  try{call.pc?.close()}catch(_){}
  try{call.ch&&sb.removeChannel(call.ch)}catch(_){}
  $("remoteV").srcObject=null;$("localV").srcObject=null;
  $("callUI").classList.remove("show");call=null;pend=[];
}

/* ============ REALTIME ============ */
const tch={};let lastTy=0,tyT=null;
function tChan(id){if(!tch[id]){const c=sb.channel("lg-typing-"+id);c._p=new Promise(r=>c.subscribe(s=>{if(s==="SUBSCRIBED")r()}));tch[id]=c}return tch[id]}
function ping(){if(!settings.sound)return;try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.08;o.start();setTimeout(()=>{o.stop();c.close()},120)}catch(_){}}
function startRealtime(){
  sb.channel("lg-rt-"+me.id)
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"lg_messages",filter:"receiver_id=eq."+me.id},async({new:m})=>{
      if(blocked.has(m.sender_id))return;
      lastMsg[m.sender_id]=m;
      if(chatPeer?.id===m.sender_id){addBub(m);sb.from("lg_messages").update({is_read:true}).eq("id",m.id).then(()=>{})}
      else{unread[m.sender_id]=(unread[m.sender_id]||0)+1;await fetchProfiles([m.sender_id]);ping();
        toast("💬 "+(pcache[m.sender_id]?.name||"")+": "+prevTxt(m.content).slice(0,40));
        if(guard(m.content).lvl===2)reportUser(m.sender_id,"AI auto-flag: "+guard(m.content).why,true)}
      renderChats();
   })
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"lg_likes",filter:"to_id=eq."+me.id},async({new:l})=>{
      likedMe.add(l.from_id);await fetchProfiles([l.from_id]);ping();
      toast(myLikes.has(l.from_id)?"💘 नवीन Match! "+(pcache[l.from_id]?.name||""):"❤️ कोणीतरी तुम्हाला Like केले");
      renderChats();
   })
   .on("postgres_changes",{event:"DELETE",schema:"public",table:"lg_likes"},({old:l})=>{
      if(!l||l.to_id!==me.id)return;
      likedMe.delete(l.from_id);
      if(chatPeer?.id===l.from_id){closeChat();toast("Match संपला")}
      renderChats();
   })
   .on("postgres_changes",{event:"UPDATE",schema:"public",table:"lg_messages",filter:"sender_id=eq."+me.id},({new:m})=>{
      const t=document.querySelector(`.bub[data-id="${m.id}"] .tk`);if(t&&m.is_read){t.textContent="✓✓";t.classList.add("rd")}})
   .on("postgres_changes",{event:"DELETE",schema:"public",table:"lg_messages"},({old:m})=>{document.querySelector(`.bub[data-id="${m.id}"]`)?.remove()})
   .subscribe();

  sb.channel("lg-user-"+me.id)
   .on("broadcast",{event:"invite"},({payload})=>onInvite(payload))
   .on("broadcast",{event:"reject"},({payload})=>{if(call&&call.id===payload.callId){toast("Call नाकारली");endCall("rejected",true)}})
   .subscribe();

  sb.channel("lg-typing-"+me.id).on("broadcast",{event:"ty"},({payload})=>{
    if(chatPeer&&chatPeer.id===payload.from){$("cSub").textContent="✍️ typing...";clearTimeout(tyT);tyT=setTimeout(updChatSub,2500)}}).subscribe();

  const pres=sb.channel("lg-presence",{config:{presence:{key:me.id}}});
  pres.on("presence",{event:"sync"},()=>{
    onlineSet=new Set(Object.keys(pres.presenceState()));onlineSet.delete(me.id);
    updChatSub();renderChats();
  }).subscribe(async s=>{if(s==="SUBSCRIBED")await pres.track({at:Date.now()})});
}

boot();
</script>
