<!DOCTYPE html>
<html lang="mr" data-theme="rose">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#14060f">
<title>Guru AI • Love Guru 💘</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root,[data-theme="rose"]{--bg:#14060f;--bg2:#1d0a17;--card:#26101f;--card2:#33162a;--line:#4a2140;--text:#fff1f6;--muted:#b995a9;--a:#ff3d7f;--b:#ff9a3d;--ok:#2ee59d;--bad:#ff5470}
[data-theme="violet"]{--bg:#0d0a1f;--bg2:#150f2e;--card:#1d1640;--card2:#291f57;--line:#3b2f78;--text:#f3f0ff;--muted:#a79fd6;--a:#9b5cff;--b:#ff4fd8}
[data-theme="ocean"]{--bg:#03121c;--bg2:#071d2b;--card:#0c2b3f;--card2:#123a53;--line:#1d5272;--text:#eaf8ff;--muted:#8fb9cf;--a:#00c2ff;--b:#00e0a4}
[data-theme="sunset"]{--bg:#1a0b05;--bg2:#251109;--card:#32180d;--card2:#432213;--line:#66341c;--text:#fff3ea;--muted:#c9a28b;--a:#ff6a3d;--b:#ffd23d}
[data-theme="light"]{--bg:#fff5f8;--bg2:#ffffff;--card:#ffffff;--card2:#ffe8f0;--line:#f3c6d6;--text:#3a1426;--muted:#8a6577;--a:#ff3d7f;--b:#ff9a3d;--ok:#12a36b;--bad:#e0334f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Roboto,Arial,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
textarea{font-family:inherit;color:var(--text)}
.gtext{background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.grad{background:linear-gradient(135deg,var(--a),var(--b))}
.page{position:fixed;inset:0;display:flex;flex-direction:column;background:
 radial-gradient(500px 300px at 0 0,color-mix(in srgb,var(--a) 20%,transparent),transparent 60%),
 radial-gradient(500px 400px at 100% 100%,color-mix(in srgb,var(--b) 14%,transparent),transparent 60%),var(--bg)}
.hdr{height:58px;padding:0 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;position:relative;background:rgba(0,0,0,.25);backdrop-filter:blur(10px)}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--a),var(--b))}
.hdr h1{font-size:21px;font-weight:900;flex:1}
.ib{width:40px;height:40px;border-radius:50%;background:var(--card2);font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ib:active{transform:scale(.92)}
.hero{text-align:center;padding:22px 20px 8px}
.hero .orb{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;font-size:40px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px color-mix(in srgb,var(--a) 40%,transparent)}
.hero h2{font-size:22px;font-weight:900}
.hero p{color:var(--muted);font-size:13.5px;line-height:1.6;margin-top:6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px}
.cd{padding:14px 12px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:left;font-size:13.5px;font-weight:700;line-height:1.4}
.cd span{display:block;font-size:24px;margin-bottom:6px}
.cd:active{border-color:var(--a)}
.aiw{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:10px}
.ai-b{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.ai-b.u{align-self:flex-end;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-bottom-right-radius:5px}
.ai-b.b{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:5px}
.ai-b .cp{display:block;margin-top:8px;font-size:11.5px;color:var(--muted);background:none;padding:0}
.typing i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--muted);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.qs{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;flex-shrink:0}
.qs::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:22px;background:var(--bg2);border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.comp{display:flex;gap:8px;padding:10px;background:var(--bg2);border-top:1px solid var(--line);align-items:flex-end}
.comp textarea{flex:1;resize:none;max-height:110px;padding:12px 15px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;font-size:15px;outline:none}
.comp textarea:focus{border-color:var(--a)}
.sendb{width:46px;height:46px;border-radius:50%;font-size:19px;color:#fff;flex-shrink:0}
.sendb:disabled{opacity:.5}
.note{font-size:11px;color:var(--muted);text-align:center;padding:0 14px 6px}
.nav{display:flex;flex-shrink:0;background:var(--bg2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:9px 0 8px;background:none;color:var(--muted);font-size:10.5px;font-weight:700}
.nav button span{display:block;font-size:22px}
.nav button.on{color:var(--a)}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:900;background:var(--card2);border:1px solid var(--a);padding:10px 16px;border-radius:14px;font-size:14px;display:none}
.toast.show{display:block}
</style>
</head>
<body>
<div class="page">
  <div class="hdr"><h1><span class="gtext">Guru AI</span> 🤖</h1><button class="ib" onclick="clearChat()" title="नवीन chat">🗑️</button></div>

  <div class="aiw" id="box"></div>

  <div class="qs" id="qs"></div>
  <div class="note">AI चुकू शकतो. पैसे/OTP कधीही कोणाला देऊ नका. 🛡️</div>
  <div class="comp">
    <textarea id="inp" rows="1" placeholder="Guru AI ला विचारा..."></textarea>
    <button class="sendb grad" id="sendB" onclick="ask()">➤</button>
  </div>

  <nav class="nav">
    <button onclick="location.href='index.html'"><span>🔥</span>Discover</button>
    <button onclick="location.href='chats.html'"><span>💬</span>Chats</button>
    <button class="on"><span>🤖</span>Guru AI</button>
    <button onclick="location.href='index.html?tab=Me'"><span>👤</span>Me</button>
  </nav>
</div>
<div class="toast" id="toast"></div>

<script>
const SB_URL="https://eqglttfffhvoyvrclzse.supabase.co";
const SB_KEY="sb_publishable_rR4xxl0dW5DJrhhjqiFHLw_uJ-HakAb";
const AI_URL="https://gyan-setu-self.vercel.app/api/chat";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const e=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const settings=JSON.parse(localStorage.getItem("lg_settings")||'{"theme":"rose"}');
document.documentElement.dataset.theme=settings.theme||"rose";
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2000)}

let me=null,prof=null,hist=[],busy=false,HK="";
const TOPICS=[
 ["💬","Icebreaker सुचव","मला 3 छोटे, मजेदार icebreaker messages सुचव."],
 ["✍️","माझा Bio सुधार","माझा dating profile bio आकर्षक कसा लिहू? एक उदाहरण दे."],
 ["🛡️","Safe dating tips","ऑनलाइन dating करताना सुरक्षित कसे राहावे? महत्त्वाचे मुद्दे सांग."],
 ["❤️","पहिल्या date ची आयडिया","पहिल्या date साठी 4 सोप्या आणि सुरक्षित आयडिया सांग."],
 ["🚩","Red flags कोणते?","dating मध्ये फसवणूक किंवा fake profile चे red flags कोणते?"],
 ["🧠","Chat कसे पुढे न्यावे","chat कंटाळवाणी होऊ नये म्हणून काय करावे?"]
];

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.replace("index.html");return}
  me=session.user;
  const {data}=await sb.from("lg_profiles").select("name").eq("id",me.id).maybeSingle();
  if(!data){location.replace("index.html");return}
  prof=data;HK="lg_ai_hist_"+me.id;
  try{hist=JSON.parse(localStorage.getItem(HK)||"[]")}catch(_){hist=[]}
  render();
}
function render(){
  const box=$("box");
  if(!hist.length){
    box.innerHTML=`<div class="hero"><div class="orb grad">🤖</div><h2>नमस्कार ${e(prof.name)}! 💘</h2><p>मी <b>Love Guru AI</b>. Dating tips, bio, icebreakers आणि फसवणुकीपासून सुरक्षा — काहीही विचारा.</p></div>
    <div class="cards">${TOPICS.map((t,i)=>`<button class="cd" onclick="useTopic(${i})"><span>${t[0]}</span>${e(t[1])}</button>`).join("")}</div>`;
    $("qs").style.display="none";
  }else{
    box.innerHTML=hist.map((m,i)=>bub(m,i)).join("");
    $("qs").style.display="flex";
    $("qs").innerHTML=TOPICS.map((t,i)=>`<button class="chip" onclick="useTopic(${i})">${t[0]} ${e(t[1])}</button>`).join("");
    box.scrollTop=box.scrollHeight;
  }
}
const bub=(m,i)=>m.r==="u"?`<div class="ai-b u">${e(m.t)}</div>`
  :`<div class="ai-b b">${e(m.t)}<button class="cp" onclick="cp(${i})">📋 Copy</button></div>`;
function cp(i){navigator.clipboard&&navigator.clipboard.writeText(hist[i].t);toast("📋 Copy झाले")}
function useTopic(i){$("inp").value=TOPICS[i][2];ask()}
function save(){try{localStorage.setItem(HK,JSON.stringify(hist.slice(-40)))}catch(_){}}
function clearChat(){if(!hist.length)return;if(!confirm("हा chat साफ करायचा?"))return;hist=[];save();render()}

async function callAI(question,ms){
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms||30000);
  try{
    const r=await fetch(AI_URL,{method:"POST",headers:{"Content-Type":"application/json"},signal:ctl.signal,body:JSON.stringify({question,image:null,imageType:null})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();return d.answer||d.message||d.response||d.text||"";
  }finally{clearTimeout(tm)}
}
async function ask(){
  if(busy)return;
  const inp=$("inp"),q=inp.value.trim();if(!q)return;
  inp.value="";inp.style.height="auto";busy=true;$("sendB").disabled=true;
  const ctx=hist.slice(-6).map(m=>(m.r==="u"?"User: ":"Guru: ")+m.t).join("\n");
  hist.push({r:"u",t:q});render();
  const box=$("box");
  box.insertAdjacentHTML("beforeend",`<div class="ai-b b typing" id="tmp"><i></i><i></i><i></i></div>`);box.scrollTop=box.scrollHeight;
  try{
    const a=await callAI(`तू "Love Guru AI" आहेस — Single लोकांसाठी असलेल्या dating app चा मैत्रीपूर्ण मार्गदर्शक आणि safety guardian. उत्तर मराठीत, थोडक्यात (जास्तीत जास्त 8 ओळी), आदरपूर्वक द्यायचे. असभ्य किंवा फसवणुकीसाठी मदत करू नकोस. User चे नाव ${prof.name}.\n${ctx}\nUser: ${q}`);
    hist.push({r:"b",t:a||"काही उत्तर मिळाले नाही, पुन्हा विचारा."});
  }catch(_){hist.push({r:"b",t:"⚠️ AI शी connect होता आले नाही. थोड्या वेळाने पुन्हा प्रयत्न करा."})}
  save();busy=false;$("sendB").disabled=false;render();
}
$("inp").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,110)+"px"});
$("inp").addEventListener("keydown",ev=>{if(ev.key==="Enter"&&!ev.shiftKey&&innerWidth>700){ev.preventDefault();ask()}});
boot();
</script>
</body>
</html>
