<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>OPEN CITY - Zombie Survival</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#080d13;color:white;font-family:Arial,sans-serif;
 touch-action:none
}
canvas{display:block;touch-action:none}
button{cursor:pointer;touch-action:manipulation}

#rotateScreen{
 position:fixed;inset:0;z-index:10000;
 background:radial-gradient(circle,#243c51,#05080c);
 display:none;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;padding:25px
}
#rotateScreen .phone{font-size:65px;animation:rotate 1.8s infinite}
#rotateScreen h1{font-size:25px;letter-spacing:2px}
#rotateScreen p{color:#bdcad5;line-height:1.7}
@keyframes rotate{
 0%,100%{transform:rotate(0)}
 50%{transform:rotate(90deg)}
}

#loading{
 position:fixed;inset:0;z-index:9000;
 background:radial-gradient(circle at center,#203b50,#05080c);
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;text-align:center;padding:20px
}
#loading h1{font-size:clamp(30px,6vw,65px);letter-spacing:5px;margin:0}
#loading p{color:#b9cbd9}
#bar{height:5px;width:min(320px,80vw);background:#263541;border-radius:9px;overflow:hidden}
#progress{height:100%;width:5%;background:#38f0cb;transition:width .3s}

#hud{position:fixed;inset:0;pointer-events:none;display:none}
.top{
 position:absolute;top:10px;left:10px;right:10px;
 display:flex;justify-content:space-between;align-items:flex-start;gap:8px
}
.panel{
 background:#07111bdc;border:1px solid #7892a755;
 border-radius:12px;padding:9px 12px;backdrop-filter:blur(8px);
 font-size:12px
}
.title{font-weight:900;font-size:15px;letter-spacing:1px}
.sub{color:#bdcbd7;margin-top:5px}
.right{display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;pointer-events:auto}
.btn{
 background:#132638e8;border:1px solid #8ba7bd88;
 color:white;border-radius:10px;padding:10px 12px;
 font-weight:bold;font-size:12px
}
.btn.active{background:#a51e30;border-color:#ff7b87}
#message{
 position:absolute;top:95px;left:50%;transform:translateX(-50%);
 padding:10px 14px;background:#07111de8;border-radius:10px;
 font-size:12px;opacity:0;transition:opacity .2s;
 text-align:center;max-width:80vw
}

#stick{
 position:absolute;left:18px;bottom:18px;
 width:120px;height:120px;border-radius:50%;
 border:2px solid #ffffff65;background:#0715228c;
 pointer-events:auto;touch-action:none
}
#nub{
 position:absolute;left:35px;top:35px;width:46px;height:46px;
 border-radius:50%;background:#b6d9efbb;border:2px solid white
}
.actions{
 position:absolute;right:18px;bottom:20px;
 display:grid;grid-template-columns:repeat(2,65px);
 gap:9px;pointer-events:auto
}
.action{
 width:65px;height:58px;border-radius:18px;
 background:#11283bdd;color:white;
 border:1px solid #a4c5ddaa;font-weight:900;font-size:11px
}
#jumpBtn{background:#135d76ed}
#actionBtn{background:#8f2536ed}
#runBtn{background:#164c36ed}
#hint{
 position:absolute;bottom:18px;left:155px;
 font-size:11px;color:#c6d7e5aa;max-width:30vw
}

@media (orientation:portrait){
 #rotateScreen{display:flex}
 #loading,#hud{visibility:hidden}
}
@media (max-width:750px) and (orientation:landscape){
 .panel{padding:6px 8px}
 .title{font-size:12px}
 .sub{font-size:10px;margin-top:3px}
 .btn{font-size:10px;padding:8px}
 #stick{width:100px;height:100px;bottom:12px;left:12px}
 #nub{left:28px;top:28px;width:40px;height:40px}
 .actions{right:10px;bottom:12px;grid-template-columns:repeat(2,56px);gap:6px}
 .action{width:56px;height:48px;font-size:10px}
 #hint{display:none}
}
</style>
</head>

<body>

<div id="rotateScreen">
 <div class="phone">📱</div>
 <h1>ROTATE YOUR PHONE</h1>
 <p>OPEN CITY खेळण्यासाठी<br>मोबाईल आडवा (Landscape) करा.</p>
 <div>🎮 3D OPEN WORLD</div>
</div>

<div id="loading">
 <h1>OPEN <span style="color:#3cebd0">CITY</span></h1>
 <p>3D OPEN WORLD · SURVIVAL</p>
 <div id="bar"><div id="progress"></div></div>
 <p id="loadText">Building your world...</p>
</div>

<div id="hud">

 <div class="top">
  <div class="panel">
   <div class="title">OPEN CITY <span style="color:#3cebd0">// SURVIVAL</span></div>
   <div class="sub">PLAYER: ASTRONAUT</div>
   <div class="sub">MODE: <b id="modeText">PEACEFUL</b></div>
   <div class="sub">❤️ <b id="health">100</b> &nbsp; ⭐ <b id="score">0</b></div>
  </div>

  <div class="right">
   <button class="btn" id="modeBtn">🧟 ZOMBIE: OFF</button>
   <button class="btn" id="viewBtn">📷 CAMERA</button>
   <button class="btn" id="resetBtn">↻ RESET</button>
  </div>
 </div>

 <div id="message"></div>

 <div id="stick"><div id="nub"></div></div>

 <div id="hint">JOYSTICK: MOVE<br>DRAG SCREEN: LOOK</div>

 <div class="actions">
  <button class="action" id="jumpBtn">JUMP</button>
  <button class="action" id="runBtn">RUN</button>
  <button class="action" id="actionBtn">ACTION</button>
  <button class="action" id="camBtn">LOOK</button>
 </div>

</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

import {GLTFLoader} from
'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

const $=id=>document.getElementById(id);

let scene,camera,renderer,loader;
let player,playerMixer;
let zombieMode=false;
let health=100,score=0;
let thirdPerson=true;
let yaw=0,pitch=.15;
let running=false,jumping=false,vy=0;
let move={x:0,z:0};
let keys={};
let pedestrians=[];
let zombies=[];
let mixers=[];
let colliders=[];
let last=performance.now();
let attackCooldown=0;
let started=false;

function isLandscape(){
 return window.innerWidth>=window.innerHeight;
}

function updateOrientation(){
 const landscape=isLandscape();
 $('rotateScreen').style.display=landscape?'none':'flex';

 if(started){
  $('hud').style.display=landscape?'block':'none';
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
 }
}

function message(text){
 $('message').textContent=text;
 $('message').style.opacity=1;
 clearTimeout(message.timer);
 message.timer=setTimeout(()=>$('message').style.opacity=0,2200);
}

function progress(text,value){
 $('loadText').textContent=text;
 $('progress').style.width=value+'%';
}

function initWorld(){

 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x9aafbd);
 scene.fog=new THREE.Fog(0x9aafbd,110,420);

 camera=new THREE.PerspectiveCamera(
  65,window.innerWidth/window.innerHeight,.1,1200
 );

 renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:'high-performance'
 });

 renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
 renderer.setSize(window.innerWidth,window.innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.outputColorSpace=THREE.SRGBColorSpace;

 document.body.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xe4f3ff,0x45505a,2.2));

 const sun=new THREE.DirectionalLight(0xffedcf,2.8);
 sun.position.set(-60,100,45);
 sun.castShadow=true;
 sun.shadow.mapSize.set(1024,1024);
 scene.add(sun);

 const mats={
  road:new THREE.MeshStandardMaterial({color:0x30373e,roughness:.95}),
  sidewalk:new THREE.MeshStandardMaterial({color:0x999c9c}),
  line:new THREE.MeshStandardMaterial({color:0xe5d8a0}),
  grass:new THREE.MeshStandardMaterial({color:0x4b6547}),
  glass:new THREE.MeshStandardMaterial({
   color:0x587d91,metalness:.25,roughness:.3
  }),
  lamp:new THREE.MeshStandardMaterial({color:0x252b31})
 };

 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(720,720),
  mats.grass
 );

 ground.rotation.x=-Math.PI/2;
 ground.position.y=-.12;
 ground.receiveShadow=true;
 scene.add(ground);

 function box(w,h,d,mat,x,y,z){
  const mesh=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),mat
  );
  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
  return mesh;
 }

 // CITY ROAD NETWORK
 for(let i=-4;i<=4;i++){
  const p=i*38;

  box(15,.12,380,mats.road,p,0,0);
  box(2,.18,380,mats.sidewalk,p-8.5,.03,0);
  box(2,.18,380,mats.sidewalk,p+8.5,.03,0);

  box(380,.12,15,mats.road,0,.01,p);
  box(380,.18,2,mats.sidewalk,0,.03,p-8.5);
  box(380,.18,2,mats.sidewalk,0,.03,p+8.5);

  for(let k=-9;k<=9;k++){
   box(.15,.025,2.8,mats.line,p,.075,k*20+10);
   box(2.8,.025,.15,mats.line,k*20+10,.075,p);
  }
 }

 // BUILDINGS
 const buildingMats=[
  0x87939a,0xb3aaa0,0x647580,0xc0b7a8,
  0x56636b,0x979d9d,0x6a777e,0x77736f
 ].map(c=>new THREE.MeshStandardMaterial({
  color:c,roughness:.82
 }));

 function building(x,z,w,d,h,index){
  const group=new THREE.Group();

  const body=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   buildingMats[index%buildingMats.length]
  );

  body.position.y=h/2;
  body.castShadow=true;
  body.receiveShadow=true;
  group.add(body);

  const rows=Math.max(2,Math.floor(h/3));
  const cols=Math.max(2,Math.floor(w/2.5));

  const windowMat=mats.glass;

  for(let r=1;r<rows;r++){
   for(let c=0;c<cols;c++){
    const wx=-w/2+(c+1)*w/(cols+1);
    const wy=r*h/rows;

    const win=new THREE.Mesh(
     new THREE.BoxGeometry(.85,1.05,.07),
     windowMat
    );

    win.position.set(wx,wy,-d/2-.04);
    group.add(win);

    const win2=win.clone();
    win2.position.z=d/2+.04;
    group.add(win2);

    const win3=new THREE.Mesh(
     new THREE.BoxGeometry(.07,1.05,.85),
     windowMat
    );

    win3.position.set(-w/2-.04,wy,-d/2+(c+1)*d/(cols+1));
    group.add(win3);

    const win4=win3.clone();
    win4.position.x=w/2+.04;
    group.add(win4);
   }
  }

  group.position.set(x,0,z);
  scene.add(group);

  colliders.push({x,z,w,d});
 }

 for(let gx=-4;gx<4;gx++){
  for(let gz=-4;gz<4;gz++){

   const cx=gx*38+19;
   const cz=gz*38+19;

   if(Math.abs(cx)<13||Math.abs(cz)<13)continue;

   const n=Math.abs(gx*7+gz*11)%3;
   const w=11+n*3;
   const d=10+((n+1)%3)*3;
   const h=14+(Math.abs(gx*13+gz*3)%7)*5;

   building(cx,cz,w,d,h,Math.abs(gx+gz*3));

   if((gx+gz)%2===0){
    building(
     cx+10,cz-8,6,7,
     9+Math.abs(gx*gz+20)%4*3,
     Math.abs(gz+4)
    );
   }
  }
 }

 // STREET LIGHTS
 for(let x=-150;x<=150;x+=38){
  for(let z=-150;z<=150;z+=38){

   if(Math.abs(x)<12||Math.abs(z)<12)continue;

   box(.18,5,.18,mats.lamp,x+10,2.5,z+10);
   box(1.6,.16,.16,mats.lamp,x+10.7,4.8,z+10);

   const bulb=new THREE.Mesh(
    new THREE.SphereGeometry(.16,8,8),
    new THREE.MeshBasicMaterial({color:0xffe1a0})
   );

   bulb.position.set(x+11.3,4.65,z+10);
   scene.add(bulb);
  }
 }

 return {box,mats};
}

function setupModel(g,scale=1){
 const model=g.scene;
 model.scale.setScalar(scale);

 model.traverse(o=>{
  if(o.isMesh){
   o.castShadow=true;
   o.receiveShadow=true;
  }
 });

 return model;
}

function getActionName(clip){
 return clip.name.split('|').pop().split('.')[0];
}

function setupAnimations(model,animations){
 const mixer=new THREE.AnimationMixer(model);
 const actions={};

 for(const clip of animations){
  actions[getActionName(clip)]=mixer.clipAction(clip);
 }

 mixers.push(mixer);

 return {mixer,actions};
}

function playAction(actor,name){
 if(!actor||!actor.actions)return;

 const actions=actor.actions;

 let key=Object.keys(actions).find(
  k=>k.toLowerCase()===name.toLowerCase()
 );

 if(!key){
  key=Object.keys(actions).find(
   k=>k.toLowerCase().includes(name.toLowerCase())
  );
 }

 if(key){
  if(actor.currentAction===key)return;

  const old=actions[actor.currentAction];
  const next=actions[key];

  next.reset().fadeIn(.18).play();
  if(old)old.fadeOut(.18);

  actor.currentAction=key;
 }
}

function loadModel(path){
 return new Promise((resolve,reject)=>{
  loader.load(path,g=>resolve(g),undefined,reject);
 });
}

async function loadPlayer(){
 try{
  const g=await loadModel('./assets/player_astronaut.glb');

  player=setupModel(g,1);
  player.position.set(0,0,0);
  scene.add(player);

  const a=setupAnimations(player,g.animations);
  playerMixer=a.mixer;
  player.actor=a;
  player.userData.animations=g.animations;

  playAction(a,'Idle');

  progress('Astronaut ready',45);

 }catch(e){
  console.error(e);
  createFallbackPlayer();
  progress('Player ready',45);
 }
}

function createFallbackPlayer(){
 const group=new THREE.Group();

 const suit=new THREE.MeshStandardMaterial({color:0xe8edf0});
 const dark=new THREE.MeshStandardMaterial({color:0x253847});
 const gold=new THREE.MeshStandardMaterial({color:0xc9a94c});

 function part(w,h,d,mat,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  m.castShadow=true;
  group.add(m);
  return m;
 }

 part(.8,1,.45,suit,0,1.25,0);
 part(.58,.58,.58,suit,0,2.05,0);

 const helmet=new THREE.Mesh(
  new THREE.SphereGeometry(.38,16,12),
  dark
 );
 helmet.position.set(0,2.12,.1);
 group.add(helmet);

 part(.2,.7,.22,suit,-.55,1.25,0);
 part(.2,.7,.22,suit,.55,1.25,0);
 part(.25,.65,.3,suit,-.22,.4,0);
 part(.25,.65,.3,suit,.22,.4,0);
 part(.3,.12,.3,gold,0,1.25,.25);

 player=group;
 scene.add(player);
 player.position.set(0,0,0);
 player.actor={actions:{},currentAction:''};
}

async function spawnPerson(path,x,z,scale=1){
 try{
  const g=await loadModel(path);
  const model=setupModel(g,scale);
  model.position.set(x,0,z);
  scene.add(model);

  const actor=setupAnimations(model,g.animations);
  const person={
   model,actor,x,z,
   phase:Math.random()*6.28,
   speed:.5+Math.random()*.55
  };

  pedestrians.push(person);
  playAction(actor,'Walk');

 }catch(e){
  console.warn('Person model unavailable:',path);
  createPersonFallback(x,z);
 }
}

function createPersonFallback(x,z){
 const group=new THREE.Group();

 const colors=[0x4268a5,0x8d4545,0x6d8c56,0x9b815e];
 const material=new THREE.MeshStandardMaterial({
  color:colors[Math.floor(Math.random()*colors.length)]
 });

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(.55,1,.35),material
 );
 body.position.y=1;
 group.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.24,12,10),
  new THREE.MeshStandardMaterial({color:0xc99b7b})
 );
 head.position.y=1.68;
 group.add(head);

 group.position.set(x,0,z);
 scene.add(group);

 pedestrians.push({
  model:group,x,z,
  phase:Math.random()*6.28,
  speed:.5+Math.random()*.6,
  fallback:true
 });
}

async function spawnZombie(x,z){
 try{
  const g=await loadModel('./assets/zombie.glb');
  const model=setupModel(g,.95);
  model.position.set(x,0,z);
  scene.add(model);

  const actor=setupAnimations(model,g.animations);

  const zombie={model,actor,attack:0,fallback:false};
  zombies.push(zombie);

  playAction(actor,'Walk');

 }catch(e){
  const group=new THREE.Group();

  const skin=new THREE.MeshStandardMaterial({color:0x68855b});
  const clothes=new THREE.MeshStandardMaterial({color:0x4b3535});

  const body=new THREE.Mesh(
   new THREE.BoxGeometry(.7,1,.4),clothes
  );
  body.position.y=1;
  group.add(body);

  const head=new THREE.Mesh(
   new THREE.SphereGeometry(.28,12,10),skin
  );
  head.position.y=1.7;
  group.add(head);

  group.position.set(x,0,z);
  scene.add(group);

  zombies.push({
   model:group,attack:0,fallback:true
  });
 }
}

function canMove(x,z){
 for(const b of colliders){
  if(
   Math.abs(x-b.x)<b.w/2+.6 &&
   Math.abs(z-b.z)<b.d/2+.6
  )return false;
 }
 return true;
}

function movePlayer(dt){
 if(!player)return;

 let ix=move.x;
 let iz=move.z;

 if(keys.KeyW||keys.ArrowUp)iz-=1;
 if(keys.KeyS||keys.ArrowDown)iz+=1;
 if(keys.KeyA||keys.ArrowLeft)ix-=1;
 if(keys.KeyD||keys.ArrowRight)ix+=1;

 const len=Math.hypot(ix,iz);

 if(len>1){
  ix/=len;
  iz/=len;
 }

 const moving=len>.08;
 const speed=(running||keys.ShiftLeft?9:5)*dt;

 const dx=(ix*Math.cos(yaw)+iz*Math.sin(yaw))*speed;
 const dz=(-ix*Math.sin(yaw)+iz*Math.cos(yaw))*speed;

 if(canMove(player.position.x+dx,player.position.z)){
  player.position.x+=dx;
 }

 if(canMove(player.position.x,player.position.z+dz)){
  player.position.z+=dz;
 }

 if(moving){
  player.rotation.y=Math.atan2(dx,dz);
  if(player.actor)playAction(player.actor,running?'Run':'Walk');
 }else{
  if(player.actor)playAction(player.actor,'Idle');
 }

 if(jumping){
  player.position.y+=vy*dt;
  vy-=22*dt;

  if(player.position.y<=0){
   player.position.y=0;
   jumping=false;
   vy=0;
  }
 }

 for(const m of mixers)m.update(dt);
}

function updatePeople(dt){
 for(const p of pedestrians){
  p.phase+=dt*p.speed;

  p.model.position.x=p.x+Math.sin(p.phase)*3;
  p.model.position.z=p.z+Math.cos(p.phase*.75)*3;

  p.model.rotation.y=Math.atan2(
   Math.cos(p.phase),
   -Math.sin(p.phase*.75)
  );
 }
}

function updateZombies(dt){
 if(!player)return;

 for(let i=zombies.length-1;i>=0;i--){
  const z=zombies[i];

  const dx=player.position.x-z.model.position.x;
  const dz=player.position.z-z.model.position.z;
  const dist=Math.hypot(dx,dz);

  if(zombieMode&&dist>1.6){
   z.model.position.x+=dx/dist*dt*2.4;
   z.model.position.z+=dz/dist*dt*2.4;
   z.model.rotation.y=Math.atan2(dx,dz);
  }

  if(zombieMode&&dist<1.8){
   z.attack-=dt;

   if(z.attack<=0){
    health=Math.max(0,health-8);
    z.attack=1.1;
    $('health').textContent=health;
    message('Zombie जवळ आहे! पळ!');

    if(health<=0){
     zombieMode=false;
     updateMode();
     message('GAME OVER! RESET दाबून पुन्हा खेळ.');
    }
   }
  }
 }
}

function updateCamera(){
 if(!player)return;

 const target=new THREE.Vector3(
  player.position.x,
  player.position.y+1.5,
  player.position.z
 );

 if(thirdPerson){
  const distance=7;

  camera.position.set(
   target.x+Math.sin(yaw)*distance*Math.cos(pitch),
   target.y+2+Math.sin(pitch)*distance,
   target.z+Math.cos(yaw)*distance*Math.cos(pitch)
  );

  camera.lookAt(target);

 }else{
  camera.position.copy(target);
  camera.position.y+=.3;
  camera.rotation.set(pitch,yaw,0,'YXZ');
 }
}

function updateMode(){
 $('modeBtn').textContent='🧟 ZOMBIE: '+(zombieMode?'ON':'OFF');
 $('modeBtn').classList.toggle('active',zombieMode);
 $('modeText').textContent=zombieMode?'ZOMBIE SURVIVAL':'PEACEFUL';
}

async function toggleZombie(){
 zombieMode=!zombieMode;
 updateMode();

 if(zombieMode){
  message('ZOMBIE MODE सुरू! वाचण्याचा प्रयत्न कर!');

  if(zombies.length===0){
   await Promise.all([
    spawnZombie(24,22),
    spawnZombie(-28,25),
    spawnZombie(30,-25),
    spawnZombie(-26,-28),
    spawnZombie(45,8)
   ]);
  }

 }else{
  message('Peaceful City Mode');
 }
}

$('modeBtn').onclick=toggleZombie;

$('viewBtn').onclick=()=>{
 thirdPerson=!thirdPerson;
 message(thirdPerson?'Third Person Camera':'First Person Camera');
};

$('camBtn').onclick=()=>{
 thirdPerson=!thirdPerson;
};

$('jumpBtn').addEventListener('pointerdown',e=>{
 e.preventDefault();

  jumping=true;
  vy=8.5;
 }
});

$('runBtn').addEventListener('pointerdown',e=>{

});

function stopRun(){running=false}

$('runBtn').addEventListener('pointerup',stopRun);
$('runBtn').addEventListener('pointercancel',stopRun);

$('actionBtn').onclick=()=>{
 if(zombieMode){
  let nearest=null;
  let distance=3.5;

  for(const z of zombies){
   const d=player.position.distanceTo(z.model.position);

   if(d<distance){
    distance=d;
    nearest=z;
   }
  }

  if(nearest){
   scene.remove(nearest.model);
   zombies.splice(zombies.indexOf(nearest),1);
   score+=10;
   $('score').textContent=score;
   message('Zombie defeated! +10');
  }else{
   message('Zombie जवळ जा आणि ACTION दाब!');
  }

 }else{
  score++;
  $('score').textContent=score;
  message('Explore the city! +1');
 }
};

$('resetBtn').onclick=()=>{
 if(player)player.position.set(0,0,0);

 health=100;
 score=0;
 zombieMode=false;

 $('health').textContent=health;
 $('score').textContent=score;

 for(const z of zombies)scene.remove(z.model);
 zombies.length=0;

 updateMode();
 message('World reset!');
};

   vy=8.5;
  }

});

window.addEventListener('keyup',e=>{

});

let dragging=false;
let lastX=0,lastY=0;

rendererPlaceholder();

function rendererPlaceholder(){}

const stick=$('stick');
const nub=$('nub');
let stickOn=false;

function stickMove(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);

 const max=35;
 const len=Math.hypot(dx,dy);

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 nub.style.left=(r.width/2-23+dx)+'px';
 nub.style.top=(r.height/2-23+dy)+'px';

 move.x=dx/max;
 move.z=dy/max;
}

stick.addEventListener('pointerdown',e=>{
 e.preventDefault();
 stickOn=true;
 stick.setPointerCapture(e.pointerId);
 stickMove(e);
});

stick.addEventListener('pointermove',e=>{
 if(stickOn)stickMove(e);
});

function endStick(){
 stickOn=false;
 move.x=0;
 move.z=0;
 nub.style.left=(stick.clientWidth/2-23)+'px';
 nub.style.top=(stick.clientHeight/2-23)+'px';
}

stick.addEventListener('pointerup',endStick);
stick.addEventListener('pointercancel',endStick);

// Drag on the world to rotate the camera
document.addEventListener('pointerdown',e=>{
 if(
  e.target===renderer.domElement &&
  e.pointerType!=='mouse'
 ){
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
 }
});

document.addEventListener('pointermove',e=>{
 if(dragging){
  yaw-=(e.clientX-lastX)*.006;
  pitch=Math.max(-.1,Math.min(.65,pitch+(e.clientY-lastY)*.003));

  lastX=e.clientX;
  lastY=e.clientY;
 }
});

document.addEventListener('pointerup',()=>dragging=false);
document.addEventListener('pointercancel',()=>dragging=false);

async function startGame(){
 loader=new GLTFLoader();

 const {box}=initWorld();

 progress('Loading Astronaut...',15);
 await loadPlayer();

 progress('Loading citizens...',55);

 await Promise.all([
  spawnPerson('./assets/pedestrian_man.glb',12,12),
  spawnPerson('./assets/pedestrian_punk.glb',-15,15),
  spawnPerson('./assets/soldier.glb',15,-16),
  spawnPerson('./assets/pedestrian_man.glb',-18,-12),
  spawnPerson('./assets/pedestrian_punk.glb',28,4)
 ]);

 progress('City ready!',100);

 started=true;
 updateOrientation();

 $('loading').style.display='none';
 $('hud').style.display=isLandscape()?'block':'none';

 message('Welcome to OPEN CITY!');

 requestAnimationFrame(loop);
}

function loop(now){
 requestAnimationFrame(loop);

 const dt=Math.min(.04,(now-last)/1000);
 last=now;

 if(isLandscape()){
  movePlayer(dt);
  updatePeople(dt);
  updateZombies(dt);
  updateCamera();
  renderer.render(scene,camera);
 }
}

window.addEventListener('resize',updateOrientation);
window.addEventListener('orientationchange',()=>{
 setTimeout(updateOrientation,250);
});

startGame().catch(e=>{
 console.error(e);
 progress('Loading error. Check your assets folder.',100);
});

</script>
