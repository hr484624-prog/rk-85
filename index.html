<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
  body{background:#fafafa}
  nav{background:#fff;border-bottom:1px solid #dbdbdb;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
  nav h1{font-family:cursive;font-size:28px}
  nav input{padding:8px 12px;border:1px solid #dbdbdb;background:#efefef;border-radius:8px;width:220px;outline:none}
  .profile{max-width:900px;margin:30px auto;padding:0 20px;display:flex;gap:50px;align-items:center}
  .dp{width:150px;height:150px;border-radius:50%;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);padding:4px}
  .dp img{width:100%;height:100%;border-radius:50%;border:3px solid white;object-fit:cover}
  .info h2{font-size:28px;font-weight:300}
  .info h2 span{font-size:14px;background:#0095f6;color:#fff;padding:6px 16px;border-radius:8px;margin-left:15px;cursor:pointer}
  .stats{display:flex;gap:30px;margin:18px 0;font-size:16px}
  .bio b{display:block}
  .tabs{display:flex;justify-content:center;gap:50px;border-top:1px solid #dbdbdb;max-width:900px;margin:20px auto;padding-top:12px;color:#737373;font-size:12px}
  .posts{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px;padding:0 20px 40px}
  .posts div{aspect-ratio:1;background:#ddd;overflow:hidden}
  .posts img{width:100%;height:100%;object-fit:cover}
  .posts div:hover{opacity:0.8}
  @media(max-width:600px){.profile{gap:20px}.dp{width:90px;height:90px}nav input{display:none}}
</style>
</head>
<body>

<nav>
  <h1>Instagram</h1>
  <input type="text" placeholder="🔍 Search">
  <div>🏠 ✉️ ➕ ❤️ 👤</div>
</nav>

<div class="profile">
  <div class="dp"><img src="https://via.placeholder.com/150" alt="dp"></div>
  <div class="info">
    <h2>apna_username <span>Follow</span></h2>
    <div class="stats"><span><b>120</b> posts</span><span><b>10k</b> followers</span><span><b>500</b> following</span></div>
    <div class="bio"><b>Apna Naam ❤️</b><span>Pune, Maharashtra<br>Welcome to my profile 🔥</span></div>
  </div>
</div>

<div class="tabs"><span>📷 POSTS</span><span>🎬 REELS</span><span>🔖 SAVED</span><span>🏷️ TAGGED</span></div>

<div class="posts">
  <div><img src="https://picsum.photos/400?1"></div>
  <div><img src="https://picsum.photos/400?2"></div>
  <div><img src="https://picsum.photos/400?3"></div>
  <div><img src="https://picsum.photos/400?4"></div>
  <div><img src="https://picsum.photos/400?5"></div>
  <div><img src="https://picsum.photos/400?6"></div>
</div>

</body>
</html>
