<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account Request</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f5f7;
    min-height:100vh;
    color:#111;
}

.topbar{
    height:65px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    box-shadow:0 1px 8px rgba(0,0,0,.08);
    position:sticky;
    top:0;
    z-index:10;
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.confirmed-btn{
    border:0;
    background:#111;
    color:white;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
}

.container{
    width:92%;
    max-width:430px;
    margin:40px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    font-size:14px;
    line-height:1.5;
    margin-bottom:22px;
}

.input{
    width:100%;
    padding:14px;
    border:1px solid #d5d5d5;
    border-radius:11px;
    outline:none;
    font-size:16px;
}

.input:focus{
    border-color:#111;
}

.send-btn{
    width:100%;
    margin-top:14px;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#111;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.send-btn:active{
    transform:scale(.98);
}

.status{
    display:none;
    margin-top:18px;
    padding:14px;
    border-radius:12px;
    font-size:14px;
    line-height:1.5;
}

.status.success{
    display:block;
    background:#e9f8ee;
    color:#16733a;
}

.status.error{
    display:block;
    background:#fff0f0;
    color:#b42318;
}

.sent-card{
    display:none;
    text-align:center;
}

.request-icon{
    width:65px;
    height:65px;
    border-radius:50%;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
    margin:0 auto 18px;
}

.username{
    font-weight:bold;
}

.back-btn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#111;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.popup{
    width:100%;
    max-width:380px;
    background:white;
    border-radius:20px;
    padding:24px;
    max-height:80vh;
    overflow:auto;
}

.popup-title{
    font-size:21px;
    font-weight:bold;
    margin-bottom:18px;
}

.close-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#eee;
    margin-top:18px;
    cursor:pointer;
}

.account{
    border:1px solid #e1e1e1;
    border-radius:13px;
    padding:14px;
    margin-bottom:10px;
}

.account-name{
    font-weight:bold;
}

.account-status{
    color:#16883b;
    font-size:13px;
    margin-top:4px;
}

.empty{
    text-align:center;
    color:#777;
    padding:25px 5px;
}

.user-info{
    background:#f4f5f7;
    padding:12px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:13px;
    color:#555;
    word-break:break-all;
}

</style>

</head>

<body>


<!-- TOP BAR -->

<div class="topbar">

    <div class="logo">
        Account Connect
    </div>

    <button
        class="confirmed-btn"
        onclick="openConfirmed()"
    >
        Confirmed Accounts
    </button>

</div>


<!-- MAIN -->

<div class="container">


    <!-- CREATE REQUEST -->

    <div
        class="card"
        id="createCard"
    >

        <div class="title">
            Request Access
        </div>

        <div class="subtitle">
            Enter the account username to create a
            connection request.
        </div>


        <div
            class="user-info"
            id="userInfo"
        >
            Checking login...
        </div>


        <input
            id="usernameInput"
            class="input"
            type="text"
            placeholder="Enter Instagram username"
            autocomplete="off"
        >


        <button
            class="send-btn"
            onclick="createRequest()"
        >
            Send Request
        </button>


        <div
            id="createStatus"
            class="status"
        ></div>

    </div>


    <!-- REQUEST SENT -->

    <div
        class="card sent-card"
        id="sentCard"
    >

        <div class="request-icon">
            ✓
        </div>

        <div class="title">
            Request Sent
        </div>

        <div class="subtitle">

            Your connection request for

            <span
                id="requestUsername"
                class="username"
            ></span>

            has been sent to the account owner.

            <br><br>

            The account owner must open their
            Account Connect account and confirm
            the request.

        </div>


        <button
            class="back-btn"
            onclick="newRequest()"
        >
            Create New Request
        </button>

    </div>

</div>


<!-- CONFIRMED ACCOUNTS POPUP -->

<div
    class="overlay"
    id="confirmedOverlay"
>

    <div class="popup">

        <div class="popup-title">
            Confirmed Accounts
        </div>

        <div id="accountList"></div>

        <button
            class="close-btn"
            onclick="closeConfirmed()"
        >
            Close
        </button>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">


/* =====================================
   FIREBASE IMPORT
===================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
    getDatabase,
    ref,
    push,
    set,
    onValue
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


/* =====================================
   FIREBASE CONFIG
===================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDul4AsRqtVgXlaN-7ery3ElF-ycONE0Tw",

    authDomain:
        "family-connect-65de6.firebaseapp.com",

    databaseURL:
        "https://family-connect-65de6-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "family-connect-65de6",

    storageBucket:
        "family-connect-65de6.firebasestorage.app",

    messagingSenderId:
        "819152591874",

    appId:
        "1:819152591874:web:3214a0348da687f9351b1b",

    measurementId:
        "G-2WN5DF6TPL"

};


/* =====================================
   START FIREBASE
===================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getDatabase(app);


/* =====================================
   USER B UID
=====================================

   This is the Firebase UID of User B.

===================================== */

const USER_B_UID =
    "O8jz1r1oHrMMTpqrdQLAsEKuEKL2";


/* =====================================
   VARIABLES
===================================== */

let currentUser =
    null;


/* =====================================
   CHECK LOGIN
===================================== */

onAuthStateChanged(
    auth,
    function(user){

        const userInfo =
            document.getElementById(
                "userInfo"
            );


        if(!user){

            currentUser =
                null;


            userInfo.innerHTML =
                "You are not logged in.<br><br>" +
                "Please login first.";


            return;

        }


        currentUser =
            user;


        userInfo.innerHTML =
            "Logged in as:<br><b>" +
            (
                user.email ||
                "Account"
            ) +
            "</b>";

    }
);


/* =====================================
   CREATE REQUEST
===================================== */

window.createRequest =
async function(){

    const input =
        document.getElementById(
            "usernameInput"
        );


    const username =
        input.value
            .trim()
            .replace(/^@/,"");


    const status =
        document.getElementById(
            "createStatus"
        );


    status.className =
        "status";


    /* LOGIN CHECK */

    if(!currentUser){

        status.textContent =
            "Please login before sending a request.";

        status.classList.add(
            "error"
        );

        return;

    }


    /* USERNAME CHECK */

    if(username === ""){

        status.textContent =
            "Please enter a username.";

        status.classList.add(
            "error"
        );

        return;

    }


    /* PREVENT SELF REQUEST */

    if(
        currentUser.uid ===
        USER_B_UID
    ){

        status.textContent =
            "You cannot send a request to yourself.";

        status.classList.add(
            "error"
        );

        return;

    }


    try{

        /* CREATE UNIQUE REQUEST */

        const newRequestRef =
            push(
                ref(
                    db,
                    "accountRequests"
                )
            );


        /* REQUEST DATA */

        const request = {

            username:
                username,

            targetUid:
                USER_B_UID,

            senderUid:
                currentUser.uid,

            senderEmail:
                currentUser.email || "",

            status:
                "pending",

            createdAt:
                new Date().toISOString(),

            confirmedAt:
                null

        };


        /* SAVE TO FIREBASE */

        await set(
            newRequestRef,
            request
        );


        /* SHOW SENT SCREEN */

        document
            .getElementById(
                "createCard"
            )
            .style.display =
                "none";


        document
            .getElementById(
                "sentCard"
            )
            .style.display =
                "block";


        document
            .getElementById(
                "requestUsername"
            )
            .textContent =
                "@" + username;


    }
    catch(error){

        console.error(
            "Create request error:",
            error
        );


        status.textContent =
            "Something went wrong. Please try again.";

        status.classList.add(
            "error"
        );

    }

};


/* =====================================
   NEW REQUEST
===================================== */

window.newRequest =
function(){

    document
        .getElementById(
            "sentCard"
        )
        .style.display =
            "none";


    document
        .getElementById(
            "createCard"
        )
        .style.display =
            "block";


    document
        .getElementById(
            "usernameInput"
        )
        .value =
            "";


    document
        .getElementById(
            "createStatus"
        )
        .className =
            "status";

};


/* =====================================
   CONFIRMED ACCOUNTS
===================================== */

window.openConfirmed =
function(){

    const overlay =
        document.getElementById(
            "confirmedOverlay"
        );


    const list =
        document.getElementById(
            "accountList"
        );


    list.innerHTML =
        "";


    const requestsRef =
        ref(
            db,
            "accountRequests"
        );


    onValue(

        requestsRef,

        function(snapshot){

            const data =
                snapshot.val() || {};


            const confirmed =
                Object.entries(
                    data
                )
                .filter(
                    ([id, account]) =>
                        account &&
                        account.status ===
                        "confirmed"
                );


            list.innerHTML =
                "";


            if(
                confirmed.length ===
                0
            ){

                list.innerHTML =
                    '<div class="empty">' +
                    'No confirmed accounts yet.' +
                    '</div>';

                return;

            }


            confirmed.forEach(
                function([
                    id,
                    account
                ]){

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "account";


                    const name =
                        document.createElement(
                            "div"
                        );


                    name.className =
                        "account-name";


                    name.textContent =
                        "@" +
                        (
                            account.username ||
                            "Unknown"
                        );


                    const status =
                        document.createElement(
                            "div"
                        );


                    status.className =
                        "account-status";


                    status.textContent =
                        "✓ Confirmed";


                    item.appendChild(
                        name
                    );


                    item.appendChild(
                        status
                    );


                    list.appendChild(
                        item
                    );

                }
            );

        },

        function(error){

            console.error(
                "Firebase read error:",
                error
            );


            list.innerHTML =
                '<div class="empty">' +
                'Could not load confirmed accounts.' +
                '</div>';

        }

    );


    overlay.style.display =
        "flex";

};


/* =====================================
   CLOSE CONFIRMED
===================================== */

window.closeConfirmed =
function(){

    document
        .getElementById(
            "confirmedOverlay"
        )
        .style.display =
            "none";

};


/* =====================================
   OUTSIDE CLICK
===================================== */

document
    .getElementById(
        "confirmedOverlay"
    )
    .addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                this
            ){

                closeConfirmed();

            }

        }
    );


</script>

</body>
</html>
