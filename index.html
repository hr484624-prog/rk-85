<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Account Connect</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f5f7;
    min-height:100vh;
    color:#111;
}

.topbar{
    height:65px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    box-shadow:0 1px 8px rgba(0,0,0,.08);
}

.logo{
    font-size:21px;
    font-weight:bold;
}

.logout{
    border:0;
    background:#111;
    color:white;
    padding:10px 14px;
    border-radius:10px;
}

.container{
    width:92%;
    max-width:430px;
    margin:40px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    font-size:14px;
    line-height:1.5;
    margin-bottom:22px;
}

.input{
    width:100%;
    padding:14px;
    border:1px solid #d5d5d5;
    border-radius:11px;
    outline:none;
    font-size:16px;
    margin-top:10px;
}

.input:focus{
    border-color:#111;
}

button{
    width:100%;
    margin-top:14px;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#111;
    color:white;
    font-size:16px;
}

.pending{
    background:#fff7df;
    color:#8a6100;
}

.success{
    background:#e9f8ee;
    color:#16733a;
}

.error{
    background:#fff0f0;
    color:#b42318;
}

.status{
    display:none;
    margin-top:18px;
    padding:14px;
    border-radius:12px;
    font-size:14px;
    line-height:1.5;
}

</style>

</head>

<body>

<div class="topbar">

    <div class="logo">
        Account Connect
    </div>

    <button
        style="width:auto;margin:0"
        onclick="logout()"
    >
        Logout
    </button>

</div>


<div class="container">

<div class="card">

    <div class="title">
        Request Access
    </div>

    <div class="subtitle">
        Send a connection request to another
        Account Connect user.
    </div>


    <input
        id="targetUid"
        class="input"
        type="text"
        placeholder="Enter User B Firebase UID"
    >


    <input
        id="username"
        class="input"
        type="text"
        placeholder="Enter account username"
    >


    <button onclick="sendRequest()">
        Send Request
    </button>


    <button
        onclick="location.href='pending.html'"
        style="background:#eee;color:#111"
    >
        View My Requests
    </button>


    <div
        id="status"
        class="status"
    ></div>

</div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
    getDatabase,
    ref,
    push,
    set
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDul4AsRqtVgXlaN-7ery3ElF-ycONE0Tw",

    authDomain:
        "family-connect-65de6.firebaseapp.com",

    databaseURL:
        "https://family-connect-65de6-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "family-connect-65de6",

    storageBucket:
        "family-connect-65de6.firebasestorage.app",

    messagingSenderId:
        "819152591874",

    appId:
        "1:819152591874:web:3214a0348da687f9351b1b",

    measurementId:
        "G-2WN5DF6TPL"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


let currentUser = null;


onAuthStateChanged(auth,function(user){

    if(!user){

        location.href = "login.html";
        return;

    }

    currentUser = user;

});


window.sendRequest = async function(){

    if(!currentUser){

        return;
    }


    const targetUid =
        document
        .getElementById("targetUid")
        .value
        .trim();


    const username =
        document
        .getElementById("username")
        .value
        .trim()
        .replace(/^@/,"");


    const status =
        document.getElementById("status");


    status.className = "status";
    status.style.display = "none";


    if(!targetUid){

        showStatus(
            "User B चा Firebase UID टाका.",
            "error"
        );

        return;
    }


    if(!username){

        showStatus(
            "Username टाका.",
            "error"
        );

        return;
    }


    if(targetUid === currentUser.uid){

        showStatus(
            "स्वतःलाच request पाठवता येणार नाही.",
            "error"
        );

        return;
    }


    try{

        const requestRef =
            push(
                ref(
                    db,
                    "accountRequests"
                )
            );


        await set(
            requestRef,
            {

                senderUid:
                    currentUser.uid,

                targetUid:
                    targetUid,

                username:
                    username,

                status:
                    "pending",

                createdAt:
                    new Date().toISOString(),

                confirmedAt:
                    null

            }
        );


        showStatus(
            "Request successfully sent. User B ने Confirm केल्यावरच connection होईल.",
            "pending"
        );


        document
            .getElementById("username")
            .value = "";


    }
    catch(error){

        console.error(error);

        showStatus(
            "Request send झाली नाही.",
            "error"
        );

    }

};


function showStatus(text,type){

    const status =
        document.getElementById("status");

    status.textContent = text;

    status.className =
        "status " + type;

    status.style.display =
        "block";

}


window.logout = async function(){

    await signOut(auth);

    location.href = "login.html";

};

</script>

</body>
</html>
