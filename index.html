<!DOCTYPE html>
<html lang="mr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Family Connect</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(135deg, #0f172a, #1d4ed8);

      color: white;
    }

    .container {
      width: 92%;
      max-width: 430px;

      padding: 30px;

      text-align: center;

      background: rgba(255,255,255,0.10);

      border: 1px solid rgba(255,255,255,0.12);

      border-radius: 24px;

      backdrop-filter: blur(15px);

      box-shadow: 0 15px 40px rgba(0,0,0,0.35);
    }

    .logo {
      font-size: 65px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 5px 0 10px;
    }

    .subtitle {
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .role {
      width: 100%;

      padding: 18px;

      margin: 10px 0;

      border: 0;

      border-radius: 15px;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;
    }

    .parent {
      background: #2563eb;
    }

    .child {
      background: #16a34a;
    }

    .role:hover {
      transform: scale(1.02);
    }


    /* Popup */

    .popup {
      display: none;

      position: fixed;

      inset: 0;

      background: rgba(0,0,0,0.70);

      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .popup-box {
      width: 100%;
      max-width: 420px;

      background: #1f2937;

      border-radius: 22px;

      padding: 25px;

      text-align: center;
    }

    .popup-box h2 {
      margin-top: 0;
    }

    input {
      width: 100%;

      padding: 16px;

      margin-top: 15px;

      border: 0;

      outline: none;

      border-radius: 12px;

      font-size: 16px;
    }

    .send {
      width: 100%;

      padding: 15px;

      margin-top: 15px;

      border: 0;

      border-radius: 12px;

      background: #2563eb;

      color: white;

      font-size: 16px;

      font-weight: bold;
    }

    .close {
      width: 100%;

      padding: 13px;

      margin-top: 10px;

      border: 0;

      border-radius: 12px;

      background: #374151;

      color: white;

      font-size: 15px;
    }

    #message {
      margin-top: 15px;

      color: #d1d5db;

      line-height: 1.5;
    }

  </style>

</head>


<body>


<div class="container">

  <div class="logo">👨‍👩‍👧</div>

  <h1>Family Connect</h1>

  <p class="subtitle">
    Parent आणि Child सुरक्षितपणे connect करा.
  </p>


  <button
    class="role parent"
    onclick="openParent()">

    👨‍👩‍👧 Parent

  </button>


  <button
    class="role child"
    onclick="openChild()">

    👦 Child

  </button>

</div>


<!-- Parent Popup -->

<div
  id="parentPopup"
  class="popup">

  <div class="popup-box">

    <h2>👨‍👩‍👧 Parent Verification</h2>

    <p>
      Child चा mobile number टाका.
    </p>

    <input
      id="childNumber"
      type="tel"
      maxlength="10"
      placeholder="10 digit mobile number">


    <button
      class="send"
      onclick="sendRequest()">

      Send Verification Request

    </button>


    <div id="message"></div>


    <button
      class="close"
      onclick="closeParent()">

      Cancel

    </button>

  </div>

</div>


<script>

function openParent() {

  document.getElementById(
    "parentPopup"
  ).style.display = "flex";

}


function closeParent() {

  document.getElementById(
    "parentPopup"
  ).style.display = "none";

}


function sendRequest() {

  const number =
    document.getElementById(
      "childNumber"
    ).value.trim();

  const message =
    document.getElementById(
      "message"
    );


  if (!/^[0-9]{10}$/.test(number)) {

    message.innerHTML =
      "❌ कृपया 10 digit mobile number टाका.";

    return;

  }


  message.innerHTML =
    "📩 Verification request तयार आहे.<br><br>" +

    "Child ने स्वतः request approve " +
    "केल्यानंतरच पुढे जाता येईल.";

}


function openChild() {

  window.location.href =
    "child.html";

}

</script>


</body>

</html>
