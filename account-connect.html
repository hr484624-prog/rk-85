<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account Connect</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f5f7;
    min-height:100vh;
    color:#111;
}

.topbar{
    height:65px;
    background:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    box-shadow:0 1px 8px rgba(0,0,0,.08);
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.logout{
    border:0;
    background:#111;
    color:white;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
}

.container{
    width:92%;
    max-width:450px;
    margin:30px auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.title{
    font-size:24px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    font-size:14px;
    line-height:1.5;
    margin-bottom:22px;
}

.input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:11px;
    outline:none;
    font-size:16px;
    margin-top:10px;
}

.send-btn{
    width:100%;
    padding:14px;
    margin-top:14px;
    border:0;
    border-radius:11px;
    background:#111;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.requests-btn{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:11px;
    background:#eee;
    color:#111;
    font-size:16px;
    cursor:pointer;
}

.message{
    display:none;
    margin-top:16px;
    padding:13px;
    border-radius:11px;
    font-size:14px;
    line-height:1.5;
}

.error{
    display:block;
    background:#fff0f0;
    color:#b42318;
}

.success{
    display:block;
    background:#e9f8ee;
    color:#16733a;
}

.user-info{
    background:#f4f5f7;
    padding:13px;
    border-radius:11px;
    margin-bottom:20px;
    font-size:13px;
    word-break:break-all;
}

</style>

</head>

<body>

<div class="topbar">

    <div class="logo">
        Account Connect
    </div>

    <button
        class="logout"
        onclick="logoutUser()"
    >
        Logout
    </button>

</div>


<div class="container">

    <div class="card">

        <div class="title">
            Request Access
        </div>

        <div class="subtitle">
            Send a connection request to another
            Account Connect user.
        </div>


        <div
            id="userInfo"
            class="user-info"
        >
            Loading account...
        </div>


        <input
            id="targetUid"
            class="input"
            type="text"
            placeholder="Enter User B Firebase UID"
            autocomplete="off"
        >


        <input
            id="targetUsername"
            class="input"
            type="text"
            placeholder="Enter account username"
            autocomplete="off"
        >


        <button
            class="send-btn"
            onclick="sendRequest()"
        >
            Send Request
        </button>


        <button
            class="requests-btn"
            onclick="location.href='pending.html'"
        >
            View My Requests
        </button>


        <div
            id="message"
            class="message"
        ></div>

    </div>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
    getDatabase,
    ref,
    set
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDul4AsRqtVgXlaN-7ery3ElF-ycONE0Tw",

    authDomain:
        "family-connect-65de6.firebaseapp.com",

    databaseURL:
        "https://family-connect-65de6-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "family-connect-65de6",

    storageBucket:
        "family-connect-65de6.firebasestorage.app",

    messagingSenderId:
        "819152591874",

    appId:
        "1:819152591874:web:3214a0348da687f9351b1b",

    measurementId:
        "G-2WN5DF6TPL"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getDatabase(app);


let currentUser = null;


onAuthStateChanged(
    auth,
    function(user){

        if(!user){

            location.href =
                "login.html";

            return;
        }


        currentUser = user;


        document
            .getElementById("userInfo")
            .innerHTML =
                "<b>Logged in:</b><br>" +
                user.email +
                "<br><br>" +
                "<b>Your UID:</b><br>" +
                user.uid;

    }
);


window.sendRequest =
async function(){

    const targetUid =
        document
            .getElementById("targetUid")
            .value
            .trim();

    const targetUsername =
        document
            .getElementById("targetUsername")
            .value
            .trim()
            .replace(/^@/,"");


    const message =
        document
            .getElementById("message");


    message.className =
        "message";


    if(!currentUser){

        message.textContent =
            "Login required.";

        message.classList.add("error");

        return;
    }


    if(targetUid === ""){

        message.textContent =
            "User B Firebase UID टाका.";

        message.classList.add("error");

        return;
    }


    if(targetUsername === ""){

        message.textContent =
            "Account username टाका.";

        message.classList.add("error");

        return;
    }


    if(targetUid === currentUser.uid){

        message.textContent =
            "स्वतःलाच request पाठवता येणार नाही.";

        message.classList.add("error");

        return;
    }


    try{

        const requestId =
            crypto.randomUUID();


        const requestData = {

            senderUid:
                currentUser.uid,

            senderEmail:
                currentUser.email,

            receiverUid:
                targetUid,

            receiverUsername:
                targetUsername,

            status:
                "pending",

            createdAt:
                new Date().toISOString(),

            confirmedAt:
                null

        };


        await set(

            ref(
                db,
                "accountRequests/" +
                requestId
            ),

            requestData

        );


        message.textContent =
            "✓ Request successfully sent.";

        message.classList.add(
            "success"
        );


        document
            .getElementById("targetUid")
            .value = "";

        document
            .getElementById("targetUsername")
            .value = "";

    }
    catch(error){

        console.error(error);

        message.textContent =
            "Request पाठवता आली नाही.";

        message.classList.add(
            "error"
        );

    }

};


window.logoutUser =
async function(){

    await signOut(auth);

    location.href =
        "login.html";

};

</script>

</body>
</html>
