<!DOCTYPE html>
<html lang="mr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Camera Permission</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      width: 90%;
      max-width: 450px;
      padding: 25px;
      text-align: center;
      background: #1f2937;
      border-radius: 20px;
    }

    .icon {
      font-size: 55px;
    }

    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 15px;
      background: black;
      display: none;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #status {
      margin-top: 15px;
      color: #d1d5db;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">📷</div>

    <h1>Camera Access</h1>

    <p>
      Parent ने camera access request केला आहे.
      Camera सुरू करण्यासाठी तुमची permission आवश्यक आहे.
    </p>

    <button onclick="startCamera()">
      Allow Camera
    </button>

    <video id="camera" autoplay playsinline></video>

    <div id="status"></div>

  </div>


  <script>

    async function startCamera() {

      const status =
        document.getElementById("status");

      const video =
        document.getElementById("camera");

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: true
          });

        video.srcObject = stream;

        video.style.display = "block";

        status.innerHTML =
          "✓ Camera permission granted.";

      } catch (error) {

        status.innerHTML =
          "Camera permission denied किंवा उपलब्ध नाही.";

      }

    }

  </script>

</body>

</html>
