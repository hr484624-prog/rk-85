<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Account Connect</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f5f7;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#111;
}

.card{
    width:92%;
    max-width:400px;
    background:white;
    padding:28px;
    border-radius:20px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    font-size:26px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    font-size:14px;
    margin-bottom:25px;
}

.input{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:1px solid #ddd;
    border-radius:11px;
    font-size:16px;
    outline:none;
}

.btn{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:0;
    border-radius:11px;
    background:#111;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.signup-btn{
    background:#eee;
    color:#111;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    font-size:14px;
}

.error{
    display:block;
    background:#fff0f0;
    color:#b42318;
}

.success{
    display:block;
    background:#e9f8ee;
    color:#16733a;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">
        Account Connect
    </div>

    <div class="subtitle">
        Login to continue.
    </div>

    <input
        id="email"
        class="input"
        type="email"
        placeholder="Enter email"
        autocomplete="email"
    >

    <input
        id="password"
        class="input"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
    >

    <button
        class="btn"
        onclick="loginUser()"
    >
        Login
    </button>

    <button
        class="btn signup-btn"
        onclick="location.href='signup.html'"
    >
        Create New Account
    </button>

    <div id="message" class="message"></div>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDul4AsRqtVgXlaN-7ery3ElF-ycONE0Tw",

    authDomain:
        "family-connect-65de6.firebaseapp.com",

    databaseURL:
        "https://family-connect-65de6-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "family-connect-65de6",

    storageBucket:
        "family-connect-65de6.firebasestorage.app",

    messagingSenderId:
        "819152591874",

    appId:
        "1:819152591874:web:3214a0348da687f9351b1b",

    measurementId:
        "G-2WN5DF6TPL"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


window.loginUser = async function(){

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    const message =
        document.getElementById("message");

    message.className = "message";


    if(email === "" || password === ""){

        message.textContent =
            "Email आणि password भरा.";

        message.classList.add("error");

        return;
    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        message.textContent =
            "Login successful.";

        message.classList.add("success");


        setTimeout(function(){

            location.href =
                "account-connect.html";

        },500);

    }
    catch(error){

        console.error(error);

        message.textContent =
            "Login failed. Email किंवा password तपासा.";

        message.classList.add("error");

    }

};

</script>

</body>
</html>
