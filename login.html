<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Account Connect</title>

<style>
body{
    margin:0;
    background:#f4f5f7;
    font-family:Arial,sans-serif;
}

.box{
    width:90%;
    max-width:400px;
    margin:80px auto;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:12px;
    border:1px solid #ddd;
    border-radius:10px;
    box-sizing:border-box;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:16px;
}

#message{
    margin-top:15px;
    color:#b42318;
}
</style>
</head>

<body>

<div class="box">

    <h2>Account Connect Login</h2>

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button onclick="login()">
        Login
    </button>

    <div id="message"></div>

</div>


<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const firebaseConfig = {

    apiKey:
        "AIzaSyDul4AsRqtVgXlaN-7ery3ElF-ycONE0Tw",

    authDomain:
        "family-connect-65de6.firebaseapp.com",

    databaseURL:
        "https://family-connect-65de6-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
        "family-connect-65de6",

    storageBucket:
        "family-connect-65de6.firebasestorage.app",

    messagingSenderId:
        "819152591874",

    appId:
        "1:819152591874:web:3214a0348da687f9351b1b",

    measurementId:
        "G-2WN5DF6TPL"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);


window.login =
async function(){

    const email =
        document.getElementById(
            "email"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    const message =
        document.getElementById(
            "message"
        );


    if(
        email === "" ||
        password === ""
    ){

        message.textContent =
            "Email and password required.";

        return;
    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        window.location.href =
            "pending.html";

    }
    catch(error){

        console.error(error);

        message.textContent =
            "Login failed. Check email and password.";

    }

};

</script>

</body>
</html>
