<!DOCTYPE html>
<html lang="mr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Voice Permission</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background: #111827;

      color: white;
    }

    .container {
      width: 90%;
      max-width: 450px;

      padding: 30px;

      text-align: center;

      background: #1f2937;

      border-radius: 20px;
    }

    .icon {
      font-size: 60px;
    }

    h1 {
      margin: 15px 0;
    }

    p {
      color: #d1d5db;
      line-height: 1.5;
    }

    button {
      width: 100%;

      padding: 15px;

      margin-top: 20px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    button.stop {
      background: #dc2626;
    }

    #status {
      margin-top: 20px;

      color: #d1d5db;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="icon">🎙️</div>

    <h1>Microphone Access</h1>

    <p>
      Parent ने microphone access request केला आहे.
      Microphone सुरू करण्यासाठी तुमची permission आवश्यक आहे.
    </p>


    <button
      id="startButton"
      onclick="startMicrophone()">

      Allow Microphone

    </button>


    <div id="status"></div>

  </div>


  <script>

    let microphoneStream = null;


    async function startMicrophone() {

      const status =
        document.getElementById("status");

      const button =
        document.getElementById("startButton");


      try {

        microphoneStream =
          await navigator.mediaDevices.getUserMedia({
            audio: true
          });


        status.innerHTML =
          "✓ Microphone permission granted.";


        button.innerHTML =
          "Stop Microphone";


        button.classList.add("stop");


        button.onclick =
          stopMicrophone;

      }

      catch (error) {

        status.innerHTML =
          "❌ Microphone permission denied किंवा उपलब्ध नाही.";

      }

    }


    function stopMicrophone() {

      if (microphoneStream) {

        microphoneStream
          .getTracks()
          .forEach(track => track.stop());

        microphoneStream = null;

      }


      document.getElementById("status").innerHTML =
        "Microphone बंद केला.";

      const button =
        document.getElementById("startButton");

      button.innerHTML =
        "Allow Microphone";

      button.classList.remove("stop");

      button.onclick =
        startMicrophone;

    }

  </script>

</body>

</html>
