<!DOCTYPE html>
<html lang="mr">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Child Verification</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background: linear-gradient(
        135deg,
        #052e16,
        #166534
      );

      color: white;
    }

    .container {
      width: 90%;
      max-width: 420px;

      padding: 30px;

      text-align: center;

      background: rgba(255,255,255,0.10);

      border-radius: 22px;

      backdrop-filter: blur(12px);

      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
    }

    .icon {
      font-size: 55px;
    }

    h1 {
      margin: 10px 0;
    }

    p {
      color: #dcfce7;
      line-height: 1.5;
    }

    input {
      width: 100%;

      padding: 16px;

      margin-top: 20px;

      border: none;
      outline: none;

      border-radius: 12px;

      font-size: 17px;
    }

    button {
      width: 100%;

      padding: 16px;

      margin-top: 15px;

      border: none;

      border-radius: 12px;

      background: #16a34a;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #15803d;
    }

    .verify-box {
      display: none;

      margin-top: 25px;

      padding: 20px;

      border-radius: 15px;

      background: rgba(255,255,255,0.10);
    }

    .number {
      font-size: 38px;

      font-weight: bold;

      letter-spacing: 7px;

      margin: 20px 0;
    }

    .status {
      margin-top: 15px;
      color: #bbf7d0;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="icon">👦</div>

    <h1>Child Verification</h1>

    <p>
      तुमचा mobile number enter करा.
      OTP ऐवजी verification number वापरला जाईल.
    </p>


    <input
      type="tel"
      id="mobileNumber"
      placeholder="10 digit mobile number"
      maxlength="10"
    >


    <button onclick="createVerification()">
      Continue
    </button>


    <div
      id="verifyBox"
      class="verify-box">

      <h2>Verification Number</h2>

      <p>
        हा number तुम्हाला दिसत आहे.
        पुढे जाण्यासाठी स्वतः Confirm करा.
      </p>

      <div
        id="verificationNumber"
        class="number">
      </div>


      <button onclick="confirmVerification()">
        ✓ Confirm
      </button>

      <div
        id="status"
        class="status">
      </div>

    </div>

  </div>


  <script>

    function createVerification() {

      const number =
        document.getElementById("mobileNumber")
        .value.trim();

      if (!/^[0-9]{10}$/.test(number)) {

        alert("कृपया 10 digit mobile number टाका.");

        return;
      }


      // 6 digit verification number
      const verificationNumber =
        Math.floor(
          100000 +
          Math.random() * 900000
        );


      document.getElementById(
        "verificationNumber"
      ).textContent = verificationNumber;


      document.getElementById(
        "verifyBox"
      ).style.display = "block";

    }


    function confirmVerification() {

      const status =
        document.getElementById("status");


      status.innerHTML =
        "✓ Verification confirmed successfully.";

    }

  </script>

</body>

</html>
